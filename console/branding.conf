# Phantom Mirage I branding (#141): the ONE source of truth for the
# customer-facing product name, legal name and copyright line. Read by the
# console (console/branding.py) and by phantom-mirage-setup (parsed, never sourced).
#
# RULE: the company is NOT registered yet, so the legal name must not carry
# a company suffix on anything customer-facing. Once registration is
# confirmed, change PM_LEGAL_NAME below (one line) to the registered name;
# PM_COPYRIGHT follows it. console/tests/test_branding.py fails if the
# suffix appears in any shipped console/static/setup file before then.
#
# Format: exactly these three KEY="value" lines (comments and blank lines
# allowed). No $, backtick, backslash or quote in values; the only
# expansion is the literal ${PM_LEGAL_NAME} inside PM_COPYRIGHT, done by
# the parsers themselves. Anything else is rejected. Control characters
# are stripped.
PM_PRODUCT="Mirage I"
PM_LEGAL_NAME="Phantom Technologies"
PM_COPYRIGHT="© 2026 ${PM_LEGAL_NAME}. All rights reserved."
