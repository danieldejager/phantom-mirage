name: ghcr-retention

# GHCR retention (#20): keep edge, every release tag (v*, X.Y.Z, X.Y, X)
# and the 3 newest other tagged images (sha-<hex> only). Cosign
# sha256-<digest>.sig / .att / .sbom tags and attestation manifests of a
# kept image (the index and every descriptor in it) are excluded by exact
# tag name, tied to a digest that is actually being kept. They are removed
# only as orphans of a deleted image. keep-n-tagged is restricted to
# sha-<hex> tags so referrer tags cannot fill those three slots.
#
# Before the cleanup action, the verify job checks every kept image
# digest (from the same run that produces exclude-tags) with the
# committed cosign.pub. A failed signature stops the workflow before
# anything is deleted. This workflow has no signing secrets.
#
# Triggers: called from the publish workflow after a successful push,
# or run on its own via workflow_dispatch. Delete mode is only honoured
# from master (refs/heads/master) when cleanup=delete is passed; a
# branch or tag dispatch stays a dry run.

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: GHCR retention (dry-run only logs)
        type: choice
        options: [dry-run, delete, skip]
        default: dry-run
  workflow_call:
    inputs:
      cleanup:
        description: GHCR retention mode from the publish workflow
        type: string
        default: dry-run

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danieldejager/phantom-mirage
  COSIGN_VERSION: v2.6.5

jobs:
  verify:
    name: Verify and dry-run
    if: inputs.cleanup != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      exclude: ${{ steps.referrers.outputs.exclude }}
      delete: ${{ steps.referrers.outputs.delete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exact referrer tags of kept images
        id: referrers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 ci/ghcr_kept_referrers.py \
            --owner danieldejager \
            --package phantom-mirage \
            --out-excludes referrer-excludes.txt \
            --out-deletes referrer-deletes.txt \
            --out-kept-digests kept-digests.txt
          extra=$(cat referrer-excludes.txt)
          going=$(cat referrer-deletes.txt)
          # base globs: edge, v*, and semver 1 / 1.7 / 1.7.0 (majors up to 99).
          # Referrer tags are appended as exact names (sha256-<digest>.sig
          # and .att / .sbom), never as a prefix glob, so a renamed tag
          # cannot slip through and signatures of deleted images are not
          # kept. wildcard-match syntax: * and ?; a dot is literal.
          base='edge,v*,?,??,?.*,??.*'
          sha='sha-???????,sha-????????,sha-?????????,sha-??????????,sha-???????????,sha-????????????'
          if [ -n "$extra" ]; then excl="${base},${extra}"; else excl="$base"; fi
          if [ -n "$going" ]; then del="${sha},${going}"; else del="$sha"; fi
          {
            echo "exclude<<EOF"
            echo "$excl"
            echo "EOF"
            echo "delete<<EOF"
            echo "$del"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify signatures of every kept image
        run: |
          set -euo pipefail
          if ! [ -s cosign.pub ]; then
            echo "::error::cosign.pub is missing from the repository"
            exit 1
          fi
          if ! grep -q -- "-----BEGIN PUBLIC KEY-----" cosign.pub; then
            echo "::error::cosign.pub is not a public key"
            exit 1
          fi
          if [ ! -s kept-digests.txt ]; then
            echo "::error::no kept image digests from the referrer computation"
            exit 1
          fi
          failed=0
          n=0
          while IFS= read -r digest || [ -n "$digest" ]; do
            [ -n "$digest" ] || continue
            n=$((n + 1))
            err=verify-$n.err
            out=verify-$n.json
            # signatures were never logged to Rekor
            if cosign verify --key cosign.pub --insecure-ignore-tlog=true \
                "$IMAGE@$digest" > "$out" 2> "$err"; then
              echo "signature verified for $IMAGE@$digest"
            else
              echo "::error::signature verification failed for $IMAGE@$digest"
              cat "$err" >&2 || true
              failed=1
            fi
          done < kept-digests.txt
          if [ "$n" -eq 0 ]; then
            echo "::error::kept digest list was empty"
            exit 1
          fi
          echo "verified $n kept image(s)"
          echo "kept images verified: $n" >> "$GITHUB_STEP_SUMMARY"
          # This repo signs with `cosign sign`, not `cosign attest`.
          # The in-toto SBOM and provenance next to the image are from
          # buildx, not cosign, so verify-attestation applies only if a
          # sha256-<digest>.att tag is actually present.
          att_subjects=$(tr ',' '\n' < referrer-excludes.txt | sed -n 's/^sha256-\([0-9a-f]\{64\}\)\.att$/sha256:\1/p' || true)
          if [ -z "$att_subjects" ]; then
            echo "no cosign attestations among kept referrer tags (buildx in-toto SBOM and provenance manifests are not cosign); skipping cosign verify-attestation"
          else
            a=0
            for digest in $att_subjects; do
              a=$((a + 1))
              err=att-$a.err
              out=att-$a.json
              if cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true \
                  "$IMAGE@$digest" > "$out" 2> "$err"; then
                echo "attestation verified for $IMAGE@$digest"
              else
                echo "::error::attestation verification failed for $IMAGE@$digest"
                cat "$err" >&2 || true
                failed=1
              fi
            done
          fi
          [ "$failed" = 0 ] || exit 1
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: danieldejager
          package: phantom-mirage
          exclude-tags: ${{ steps.referrers.outputs.exclude }}
          # Restrict keep-n-tagged to sha-<hex> image tags (the
          # metadata-action short SHA is 7 hex digits; 8-12 are listed
          # in case that format grows). This must not use sha-*, which
          # would also match sha256-<digest>.sig. Exact referrer tags of
          # images that are being deleted are appended so they go in the
          # same run as their parent, not only as later orphans.
          delete-tags: ${{ steps.referrers.outputs.delete }}
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
          dry-run: true

  delete:
    name: Delete
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      inputs.cleanup == 'delete' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: danieldejager
          package: phantom-mirage
          # Same exclude/delete lists the verify job already computed
          # and checked signatures against.
          exclude-tags: ${{ needs.verify.outputs.exclude }}
          delete-tags: ${{ needs.verify.outputs.delete }}
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
          dry-run: false
