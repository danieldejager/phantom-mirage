name: security-sanitizers

# tests/security under clang ASan + UBSan + LSan, as tests/security/run.sh
# runs it locally. Not behind the "Heavy jobs?" gate in build.yml: it runs
# on every pull request into security-code-review and every push to it.
# One standard GitHub hosted runner (ubuntu-latest), no matrix.
# Private repo Actions minutes may cost money: about 5 to 8 runner minutes
# per run (estimate from a local run of the suite, plus setup).
on:
  pull_request:
    branches: [security-code-review]
    paths-ignore: ['docs/**', '**.md', 'tools/fingerprint-lab/**']
  push:
    branches: [security-code-review]
    paths-ignore: ['docs/**', '**.md', 'tools/fingerprint-lab/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: tests/security / clang ASan + UBSan + LSan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Same toolchain as the local runs (Debian 13, clang 19)
      image: debian:13
    env:
      # The run.sh defaults, spelled out. LSan is on unless a test turns
      # it off itself. There is no leak suppressions file, so LSAN_OPTIONS
      # is left unset and every leak is reported with its stack trace.
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            clang libclang-rt-19-dev
          clang --version | head -1

      - name: Create a non root user (uid 1000)
        # Some tests skip or test differently as root (stats_secret_file,
        # and droppriv_perms when built with Python), so the suite runs as an ordinary user.
        run: |
          useradd -m -u 1000 -s /bin/sh builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure
        # Default configure (no Python), as the local runs use. With
        # --with-python the harnesses that do not link the whole daemon
        # fail to link, so droppriv_perms (which needs Python) skips here.
        run: runuser -u builder -- sh -c './autogen.sh && ./configure'

      - name: tests/security/run.sh
        shell: bash
        run: |
          set -o pipefail
          runuser -u builder -- env CC=clang \
            ASAN_OPTIONS="$ASAN_OPTIONS" UBSAN_OPTIONS="$UBSAN_OPTIONS" \
            sh -c 'id -u && sh tests/security/run.sh' 2>&1 | tee security.log
          if grep -q '^FAIL' security.log; then exit 1; fi
          n=$(grep -c '^PASS' security.log || true)
          echo "tests/security: $n passed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: tests/security/out/*.log
          retention-days: 7
