name: publish

# Signed, private container images on GHCR (#20):
#   ghcr.io/danieldejager/phantom-mirage
# Pushes ONLY on v* tags and on a manual dispatch from master with
# push=true; never from pull requests.
#
# * Auth: the workflow's own GITHUB_TOKEN (packages: write). No PAT.
# * Tags: sha-<short> always, edge on master, semver on v* tags.
# * SBOM + max provenance: buildx attestations, stored in the registry
#   next to the image (private). Nothing goes to Sigstore/Rekor.
# * Signature: cosign with a private key from repository secrets
#   (COSIGN_PRIVATE_KEY, COSIGN_PASSWORD), by digest, with
#   --tlog-upload=false so nothing is recorded in the public
#   transparency log. A missing key fails the job.
# * The package must be private: checked through the API after every
#   push (also the very first one, which creates the package).

# CI minutes: only v* tags and manual dispatch (push=true to publish
# edge/sha from master); the build is checked by the nightly Docker job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: Push and sign the image (from master)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # never cancel a publish half-way (pushed but unsigned); only build-only runs
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.push }}

env:
  IMAGE: ghcr.io/danieldejager/phantom-mirage
  PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push && github.ref == 'refs/heads/master') }}
  COSIGN_VERSION: v2.6.5

jobs:
  image:
    name: Build, push, sign (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing key present (push only)
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error title=No signing key::Repository secret COSIGN_PRIVATE_KEY is not set. Create it (and COSIGN_PASSWORD) as described in docs/docker.md; refusing to publish an unsigned image."
            exit 1
          fi
          if [ -z "${COSIGN_PASSWORD+x}" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "::error title=No key password::Repository secret COSIGN_PASSWORD is not set (see docs/docker.md)."
            exit 1
          fi
          echo "signing key secrets are present (contents not shown)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with GITHUB_TOKEN
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          # explicit: metadata-action would otherwise copy the GitHub repo
          # description into the image
          labels: |
            org.opencontainers.image.title=phantom-mirage
            org.opencontainers.image.description=Phantom Mirage I, based on Honeyd
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=phantom-mirage
            org.opencontainers.image.description=Phantom Mirage I, based on Honeyd
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build (and push on master / v*)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # in-toto SBOM and SLSA provenance as registry attestations
          # (private, next to the image; not sent to any transparency log)
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package is private
        # Right after the push, so the very first push (which creates the
        # package) is checked too. Fails loudly if it is public or if the
        # visibility can't be read.
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if vis=$(gh api "users/$OWNER/packages/container/phantom-mirage" -q .visibility 2>err.txt); then break; fi
            vis=; sleep 10
          done
          if [ -z "$vis" ]; then
            echo "::error title=Visibility unknown::Could not read the visibility of ghcr.io/$OWNER/phantom-mirage: $(cat err.txt). Check it at https://github.com/users/$OWNER/packages/container/package/phantom-mirage/settings and make it private."
            exit 1
          fi
          echo "package visibility: $vis"
          if [ "$vis" != private ]; then
            echo "::error title=PACKAGE IS PUBLIC::ghcr.io/$OWNER/phantom-mirage is '$vis'. Make it private NOW: https://github.com/users/$OWNER/packages/container/package/phantom-mirage/settings"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign by digest (private key, no transparency log)
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::no image digest from the build"; exit 1; }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --recursive "$IMAGE@$DIGEST" 2>&1 | tee sign.log
          if grep -Eiq 'tlog entry created|rekor' sign.log; then
            echo "::error::cosign talked to a transparency log"; exit 1
          fi

      - name: Verify the signature; no public log entry
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # the public half only, written to a file, never printed
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub 2>/dev/null
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            "$IMAGE@$DIGEST" > verify.json
          echo "signature verified for $IMAGE@$DIGEST"
          # no Rekor bundle attached to the signature: it was never logged
          cosign download signature "$IMAGE@$DIGEST" > sig.json
          # one JSON object per line; cosign always emits a "Bundle" field,
          # null when nothing was logged. Fail only on a real bundle.
          jq -c '{Bundle: .Bundle, RFC3161Timestamp: .RFC3161Timestamp}' sig.json
          n=$(jq -s 'length' sig.json)
          logged=$(jq -s '[.[] | select(.Bundle != null and .Bundle != {})] | length' sig.json)
          echo "signatures: $n, with a transparency-log bundle: $logged"
          [ "$n" -gt 0 ] || { echo "::error::no signature found"; exit 1; }
          if [ "$logged" != 0 ]; then
            echo "::error::the signature carries a transparency-log bundle"; exit 1
          fi
          echo "no transparency-log bundle on the signature"

      - name: Attestations stay in the registry
        # buildx stores the SBOM and provenance as attestation manifests in
        # the image index (unsigned, private); check they are there.
        # also when signing/verification failed: the attestations are
        # pushed with the image and should be checked regardless
        if: env.PUSH == 'true' && !cancelled() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # manifests only: never pipe the full SPDX/provenance documents
          # into head (SIGPIPE made buildx exit 255 under pipefail)
          python3 ci/check_attestations.py "$IMAGE@$DIGEST"

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### phantom-mirage image"
            echo "push: $PUSH"
            echo "digest: \`${DIGEST:-none}\`"
            echo '```'; echo "$TAGS"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
