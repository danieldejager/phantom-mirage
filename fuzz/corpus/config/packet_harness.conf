create default
set default default tcp action block
set default default udp action block
set default default icmp action open
create linux
set linux personality "Linux 2.6.32"
set linux default tcp action reset
set linux default udp action reset
add linux tcp port 22 open
add linux tcp port 80 open
add linux udp port 53 open
add linux udp port 161 block
create win
set win personality "Microsoft Windows XP Professional SP1"
set win default tcp action reset
add win tcp port 445 open
set win droprate in 0
bind 10.0.0.2 linux
bind 10.0.0.3 win
bind 10.1.0.2 linux
route entry 10.0.0.1 network 10.0.0.0/16
route 10.0.0.1 link 10.0.0.0/24
route 10.0.0.1 add net 10.1.0.0/24 10.1.0.1 latency 0ms loss 0
route 10.1.0.1 link 10.1.0.0/24
