name: build

# CI minutes (private repo): PRs and master pushes run only the fast core
# set (debian13: build, smoke, unit tests, regress/; deb: the package).
# The heavy jobs (sanitizers, arm64, systemd, script namespaces, Docker,
# fuzz) run nightly when master changed, on PRs labelled "full-ci", and
# on workflow_dispatch.
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '30 16 * * *'   # 03:30 Australia/Melbourne (AEDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the heavy jobs run (see the header).
  gate:
    name: Heavy jobs?
    # adding any label other than full-ci runs nothing
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.g.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 1
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          heavy=false
          case $EVENT in
            workflow_dispatch) heavy=true ;;
            pull_request) [ "$FULL" = true ] && heavy=true ;;
            schedule)
              # skip the nightly when master has no commit in the last 24 h
              if [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then heavy=true; fi ;;
          esac
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  debian13:
    name: Debian 13 / GCC 14
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:13
      # NET_ADMIN: the regress/ veth pair
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev

      - name: Toolchain versions
        run: gcc --version | head -1 && autoconf --version | head -1

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          # Python is opt-in (#36): the default build has no libpython
          ! grep -q '^#define HAVE_PYTHON' config.h

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Count compiler warnings
        run: |
          n=$(grep -c "warning:" build.log || true)
          echo "Compiler warnings: $n" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        # Runs from the build tree, before anything is installed.
        run: |
          D=$PWD
          # No /usr/share/phantom-mirage here: phantom-mirage must start without it (#43).
          test ! -e /usr/share/phantom-mirage
          ./phantom-mirage --version
          ./phantom-mirage --verify-config -f $D/ci/smoke.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes
          for b in phantom-mirage-ctl phantom-mirage-stats phantom-mirage-sniff; do test -x ./$b; done

      - name: "make install + run from the installed tree (#36)"
        # make install needs no Python (#36) and must not touch $HOME.
        run: |
          set -x
          make install DESTDIR=$PWD/destdir
          for f in usr/bin/phantom-mirage usr/bin/phantom-mirage-ctl usr/bin/phantom-mirage-stats \
                   usr/bin/phantom-mirage-sniff usr/lib/phantom-mirage/libphantom-mirage.so \
                   usr/share/phantom-mirage/nmap-os-db usr/share/phantom-mirage/xprobe2.conf \
                   usr/share/phantom-mirage/nmap.assoc usr/share/phantom-mirage/pf.os \
                   usr/share/phantom-mirage/nmap-mac-prefixes \
                   usr/share/phantom-mirage/scripts/lib/names.py \
                   usr/include/honeyd/hooks.h; do
            test -e destdir/$f || { echo "missing $f" >&2; exit 1; }
          done
          test ! -e "$HOME/.config/phantom-mirage"
          make install
          mkdir -p /var/run
          cd /
          # Data files found via the compiled-in defaults, no -p/-x/...
          phantom-mirage --verify-config -f "$GITHUB_WORKSPACE/ci/smoke.conf" -i lo --disable-webserver
          timeout 20 phantom-mirage -d -f "$GITHUB_WORKSPACE/ci/smoke.conf" -i lo \
            --disable-webserver > /tmp/installed.log 2>&1 &
          for i in $(seq 1 20); do
            echo "list template" | timeout 5 phantom-mirage-ctl > /tmp/ctl.out 2>&1 && break
            sleep 0.5
          done
          cat /tmp/ctl.out
          grep -q 10.99.0.10 /tmp/ctl.out
          kill -INT %1 || true
          wait %1 || true
          cat /tmp/installed.log
          grep -q 'Demoting process privileges' /tmp/installed.log
          python3 -c 'import sys; sys.path.insert(0, "/usr/share/phantom-mirage/scripts/lib"); import names' \
            || echo "python3 not installed here; names.py import skipped"

      - name: Unit tests + regress/ (core, no nmap)
        # The fast subset of the sanitizers job: unit tests and one pass
        # of the deterministic regress/ suite (nmap.py runs nightly).
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-dpkt diffutils iproute2 >/dev/null
          python3 ci/test_webserver.py
          ci/test_check_attestations.sh
          python3 ci/test_scripts.py
          cd regress
          bad=0
          for t in general.py detect.py routing.py; do
            set +e; timeout -k 10 180 python3 "$t" > "../regress-$t.log" 2>&1; rc=$?; set -e
            tail -3 "../regress-$t.log"
            [ $rc = 0 ] || { echo "$t: rc=$rc" >&2; bad=1; }
          done
          exit $bad

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            config.log
            events.jsonl
            phantom-mirage.log
            regress-*.log
          if-no-files-found: ignore

  sanitizers:
    name: Debian 13 / ASan + UBSan
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: debian:13
      # NET_ADMIN: the subsystem step routes a honeypot subnet over lo.
      # SYS_ADMIN: regress/nmap.py runs nmap in its own network namespace
      # (unshare --net + nsenter, no mounts).
      options: --cap-add=NET_ADMIN --cap-add=SYS_ADMIN
    env:
      # Findings fail the job. Leak detection is off because phantom-mirage keeps
      # its config, personalities and assoc tables for the whole process
      # lifetime and never frees them on exit (~590 KB in ~14k allocations
      # reported per --verify-config), so LSan output is all noise.
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:detect_leaks=0:print_stacktrace=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            python3-dev

      - name: Configure
        # Makefile.am hard-codes CFLAGS, which overrides a configure-time
        # CFLAGS, so the sanitizer flags go in through CPPFLAGS (used for
        # every compile) and LDFLAGS. The Makefile's -O2 comes after our
        # -O1, so the effective optimisation level is -O2.
        run: |
          ./autogen.sh
          CPPFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" \
          ./configure --prefix=/usr --with-python
          # Embedded Python 3 is on in this job only (#36)
          grep -q '^#define HAVE_PYTHON 1' config.h

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Rebuild libphantom-mirage.so without sanitizers
        # libphantom-mirage.so is an LD_PRELOAD shim for unsanitized subsystem
        # binaries. An ASan runtime dependency would break it there
        # (ASan must be first in the link order), so rebuild just the
        # shim's objects without sanitizer flags.
        run: |
          rm -f libphantom-mirage.so libhoneyd-*.lo .libs/libhoneyd-*.o
          make CPPFLAGS= LDFLAGS= libphantom-mirage.so
          # ldd misses instrumented objects (undefined __asan_* symbols
          # with no NEEDED entry), so check the symbol table too.
          if ldd libphantom-mirage.so | grep -E 'libasan|libubsan' ||
             nm -D libphantom-mirage.so | grep -E ' U __(asan|ubsan)_'; then
            echo "libphantom-mirage.so is still sanitizer-instrumented" >&2; exit 1
          fi

      - name: Prepare test data
        # No /usr/share/phantom-mirage here: phantom-mirage must start without it (#43).
        run: test ! -e /usr/share/phantom-mirage

      - name: Relative-path smoke test (sanitized, #10/#48)
        # determine_path() turns relative paths into absolute ones; ASan
        # catches any under-allocation regression here.
        run: |
          ./phantom-mirage --verify-config -f ci/smoke.conf -i lo --disable-webserver \
            -p nmap-os-db -x xprobe2.conf -a nmap.assoc \
            -0 pf.os -m nmap-mac-prefixes

      - name: Smoke test (sanitized)
        run: |
          D=$PWD
          ./phantom-mirage --version
          for f in ci/smoke.conf ci/sanitizer.conf; do
            echo "== verify-config $f"
            ./phantom-mirage --verify-config -f $D/$f -i lo --disable-webserver \
              -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
              -0 $D/pf.os -m $D/nmap-mac-prefixes
          done
          # --help/usage exits non-zero in these tools, so check the output
          # for sanitizer reports instead of the exit code.
          for b in phantom-mirage-ctl phantom-mirage-stats phantom-mirage-sniff; do
            echo "== $b --help"
            ./$b --help > $b.out 2>&1 || true
            head -5 $b.out
            if grep -E 'runtime error|ERROR: AddressSanitizer' $b.out; then exit 1; fi
          done

      - name: Control socket lockdown (sanitized, #14)
        # Runs the daemon on lo for a few seconds: the socket dir must be
        # root 0700, the socket 0600, root's phantom-mirage-ctl must work and a
        # non-root peer must be refused (SO_PEERCRED, checked with the
        # permissions opened up so the kernel does not refuse it first).
        run: |
          D=$PWD
          mkdir -p /var/run
          timeout 30 ./phantom-mirage -d -f $D/ci/smoke.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes > phantom-mirage-ui.log 2>&1 &
          for i in $(seq 1 20); do
            test -S /run/phantom-mirage/phantom-mirage.sock && break; sleep 0.5
          done
          stat -c '%a %U:%G %F %n' /run/phantom-mirage /run/phantom-mirage/phantom-mirage.sock
          test "$(stat -c '%a %u' /run/phantom-mirage)" = "700 0"
          test "$(stat -c '%a %u %F' /run/phantom-mirage/phantom-mirage.sock)" = "600 0 socket"
          echo "list template" | timeout 5 ./phantom-mirage-ctl | tee ctl-root.out
          grep -q '10.99.0.10' ctl-root.out
          chmod 755 /run/phantom-mirage; chmod 666 /run/phantom-mirage/phantom-mirage.sock
          echo "list template" | timeout 5 setpriv --reuid=65534 --regid=65534 \
            --clear-groups ./phantom-mirage-ctl > ctl-nobody.out 2>&1 || true
          sleep 1
          kill -INT %1 || true
          wait %1 || true
          cat phantom-mirage-ui.log
          if grep -q '10.99.0.10' ctl-nobody.out; then
            echo "non-root peer was served" >&2; exit 1
          fi
          grep -q 'rejected ui connection from .* uid 65534' phantom-mirage-ui.log
          if grep -E 'runtime error|ERROR: AddressSanitizer' phantom-mirage-ui.log; then exit 1; fi

      - name: Subsystem connection + JSON log (sanitized, #22, #24)
        # A TCP connection to a subsystem port used to crash phantom-mirage
        # (event_add(NULL) in cmd_subsystem_schedule_connect). Run a tiny
        # subsystem through the libphantom-mirage.so shim and connect to it three
        # times over lo.
        # After phantom-mirage drops privileges the sanitizer runtime cannot read
        # /proc/self/environ, so UBSAN_OPTIONS (halt_on_error, suppressions)
        # do not apply to later reports; the log is grepped instead.
        run: |
          D=$PWD
          apt-get install -y --no-install-recommends iproute2 python3 >/dev/null
          install -D -m 755 libphantom-mirage.so /usr/lib/phantom-mirage/libphantom-mirage.so
          gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c
          cp ci/svc_escape.sh /tmp/svc_escape.sh
          # phantom-mirage opens its logs after dropping to nobody (#24 docs)
          install -d -m 1777 /tmp/hdlogs
          ip route add 10.99.0.0/24 dev lo
          cat > /tmp/subsys.conf <<'CONF'
          create default
          set default default tcp action block
          create linux
          set linux personality "Linux 2.6.32"
          set linux default tcp action reset
          add linux subsystem "/tmp/subsys_echo"
          add linux tcp port 2323 "/bin/sh /tmp/svc_escape.sh"
          bind 10.99.0.10 linux
          CONF
          mkdir -p /var/run
          timeout 60 ./phantom-mirage -d -f /tmp/subsys.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes \
            -l /tmp/hdlogs/phantom-mirage.log --json-log=/tmp/hdlogs/events.jsonl \
            --sensor-id=ci-sensor-1 --heartbeat=1 \
            > phantom-mirage-sub.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q 'Listen: .*:18080' phantom-mirage-sub.log && break; sleep 0.5
          done
          ok=0
          for i in 1 2 3; do
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'" && ok=$((ok+1))
          done
          # script port: its stderr becomes "service" events
          python3 -c "import socket; s=socket.create_connection(('10.99.0.10',2323),timeout=5); s.recv(1)" || true
          sleep 2
          kill -INT %1 || true
          wait %1 || true
          cat phantom-mirage-sub.log
          if grep -E 'runtime error|ERROR: AddressSanitizer' phantom-mirage-sub.log; then
            exit 1
          fi
          test "$ok" = 3
          test "$(grep -c 'Connection established: .*subsystem' phantom-mirage-sub.log)" = 3
          # Text log still written as before; JSON log valid with the schema
          grep -q 'tcp(6) S ' /tmp/hdlogs/phantom-mirage.log
          cp /tmp/hdlogs/events.jsonl /tmp/hdlogs/phantom-mirage.log .
          python3 ci/check_json_log.py events.jsonl ci-sensor-1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Embedded Python 3 service script (sanitized, #36)
        # phantom-mirage built --with-python; an "internal" Python 3 service
        # (scripts/python/echo_banner.py) answers three connections over lo,
        # honeyd.log() reaches the service log, phantom-mirage-ctl "!" runs Python,
        # and the read-only status page (webserver/) answers on 127.0.0.1.
        # Uses the 10.99.0.0/24 route over lo from the subsystem step.
        shell: bash
        run: |
          python3 ci/test_webserver.py
          ci/test_check_attestations.sh
          ci/python_service.sh

      - name: Python 3 service scripts under scripts/ (#36)
        # Canned SMB/TDS/MySQL/NBNS/mDNS requests over stdin/stdout get a
        # sane reply; non-UTF-8 bytes, NULs, truncated and random packets
        # must not crash, hang or traceback.
        run: python3 ci/test_scripts.py

      - name: Privilege hardening + script sandbox (sanitized, #16)
        # Default: phantom-mirage and every script child run with all IDs 65534,
        # no capabilities (incl. bounding/ambient), no_new_privs.
        # --sandbox-scripts: script children also get Landlock + seccomp.
        # SIGHUP/SIGUSR1 must keep working with the hardened process.
        shell: bash
        run: |
          D=$PWD
          apt-get install -y --no-install-recommends procps util-linux >/dev/null
          install -d -m 755 /tmp/hdsb
          install -d -m 1777 /tmp/hdsb/tmp /tmp/hdsb/rw
          install -m 755 ci/sandbox_probe.sh /tmp/hdsb/sandbox_probe.sh
          cat > /tmp/hdsb/sb.conf <<'CONF'
          create default
          set default default tcp action block
          create linux
          set linux personality "Linux 2.6.32"
          set linux default tcp action reset
          add linux subsystem "/tmp/subsys_echo"
          add linux tcp port 2325 "/bin/sh /tmp/hdsb/sandbox_probe.sh"
          bind 10.99.0.10 linux
          CONF
          run() {
            mode=$1; shift
            rm -f /tmp/hdsb/tmp/* /tmp/hdsb/rw/*
            timeout 60 ./phantom-mirage -d -f /tmp/hdsb/sb.conf -i lo --disable-webserver \
              -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
              -0 $D/pf.os -m $D/nmap-mac-prefixes "$@" > sb-$mode.log 2>&1 &
            hp=$!
            for i in $(seq 1 30); do
              grep -q 'Listen: .*:18080' sb-$mode.log && break; sleep 0.5
            done
            # $hp is timeout(1); signal and inspect phantom-mirage itself
            hd=$(pgrep -n -P $hp -x phantom-mirage)
            ll=""
            grep -q 'Landlock unavailable' sb-$mode.log && ll=no-landlock || true
            python3 ci/check_sandbox.py $mode $hd $ll | tee -a "$GITHUB_STEP_SUMMARY"
            rc=${PIPESTATUS[0]}
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'"
            kill -HUP $hd; sleep 1; kill -USR1 $hd; sleep 1
            kill -0 $hd
            grep -q 'rereading configuration' sb-$mode.log
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'"
            kill -INT $hd || true
            wait $hp || true
            cat sb-$mode.log
            ! grep -E 'runtime error|ERROR: AddressSanitizer|sandbox: .*(failed|remain|not dropped)' sb-$mode.log
            return $rc
          }
          echo "### default" >> "$GITHUB_STEP_SUMMARY"
          run default
          echo "### --sandbox-scripts" >> "$GITHUB_STEP_SUMMARY"
          run sandbox --sandbox-scripts --sandbox-allow-write=/tmp/hdsb/rw

      - name: "regress/ suite (gating, veth pair, #36 #74)"
        # Deterministic since #74: veth pair instead of lo, -R seeds all
        # of phantom-mirage's randomness, the harness masks only wall-clock and
        # kernel-chosen fields (regress/IMPORTANT_NOTES.txt). Runs the
        # suite 3 times; any mismatch or harness error fails the job.
        # nmap.py runs real nmap -O against fixed personalities.
        shell: bash
        run: |
          apt-get install -y --no-install-recommends python3-dpkt diffutils nmap >/dev/null
          cd regress
          echo "### regress/ (gating)" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for run in 1 2 3; do
            for t in general.py detect.py routing.py nmap.py; do
              log="../regress-${t%.py}-$run.log"
              set +e; timeout -k 10 300 python3 "$t" > "$log" 2>&1; rc=$?; set -e
              cat "$log"
              case $rc in
                0) r="all match" ;;
                3) r="MISMATCH"; bad=1 ;;
                *) r="HARNESS ERROR rc=$rc"; bad=1 ;;
              esac
              echo "- run $run \`$t\`: $r — $(grep -E '^  (OK|FAILED)' "$log" | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          if grep -E 'runtime error|ERROR: AddressSanitizer' ../regress-*.log; then bad=1; fi
          exit $bad

      - name: "--sandbox-daemon: suites under the daemon seccomp allowlist (#16)"
        # Same services as above (subsystem, shell script, Python 3
        # service, status page, phantom-mirage-ctl, SIGHUP/SIGUSR1, plus
        # --sandbox-scripts), then the regress/ suite incl. nmap.py, with
        # phantom-mirage confined to its syscall allowlist. A denied call logs
        # "sandbox-daemon: denied syscall N" (daemon) or "killed by
        # SIGSYS" (child) and fails the step; ci/sandbox_daemon.sh also
        # checks that an off-list call (mount) is caught, and that
        # Landlock keeps the daemon to its log/socket/graphs dirs and
        # refuses TCP connects (HD_LANDLOCK=require: must be active).
        shell: bash
        env:
          HD_LANDLOCK: require
        run: |
          bash ci/sandbox_daemon.sh
          # pid file: start/stop/restart, stale file, second instance
          bash ci/pidfile.sh
          # per-script namespaces: the container refuses them, so this
          # checks the logged fallback (the script-ns job checks them)
          bash ci/script_ns.sh
          # Again as under debian/phantom-mirage.service: no_new_privs, the unit's
          # capability bounding set, writable state only below /run.
          # (ProtectSystem=strict needs mounts, which the CI container
          # refuses; it was checked by hand, see docs/sandboxing.md.)
          mkdir -p unit-logs
          HD_WRAP="setpriv --no-new-privs --inh-caps=-all --bounding-set=-all,+net_raw,+net_admin,+setuid,+setgid" \
            HD_WORK=/run/hdsd HD_LOGDIR=$PWD/unit-logs bash ci/sandbox_daemon.sh
          HD_WRAP="setpriv --no-new-privs --inh-caps=-all --bounding-set=-all,+net_raw,+net_admin,+setuid,+setgid" \
            HD_LOGDIR=$PWD/unit-logs bash ci/pidfile.sh
          cd regress
          bad=0
          for t in general.py detect.py routing.py nmap.py; do
            log="../regress-sbd-${t%.py}.log"
            set +e; REGRESS_PHANTOM_MIRAGE_ARGS=--sandbox-daemon timeout -k 10 300 \
              python3 "$t" -d > "$log" 2>&1; rc=$?; set -e
            tail -5 "$log"
            [ $rc = 0 ] || { echo "$t: rc=$rc" >&2; bad=1; }
            grep -q 'sandbox-daemon: seccomp allowlist active' "$log" || { echo "$t: filter not active" >&2; bad=1; }
            if grep -E 'sandbox-daemon: denied syscall|killed by SIGSYS' "$log"; then bad=1; fi
          done
          exit $bad

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-sanitizers
          path: |
            build.log
            config.log
            events.jsonl
            phantom-mirage.log
            regress-*.log
            regress/nmap.log
            sandbox-daemon-*.log
            unit-logs/*.log
            phantom-mirage-py*.log
            phantom-mirage-py-ctl.out
          if-no-files-found: ignore

  deb:
    name: Debian 13 / .deb package
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/phantom-mirage

      - name: Install packaging tools and build-deps
        working-directory: src/phantom-mirage
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs lintian
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: dpkg-buildpackage -us -uc -b
        working-directory: src/phantom-mirage
        run: dpkg-buildpackage -us -uc -b

      - name: lintian (report only)
        working-directory: src
        run: |
          lintian --info --display-info *.changes 2>&1 | tee lintian.txt || true
          { echo '### lintian'; echo '```'; cat lintian.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the .deb with apt and run it
        working-directory: src
        run: |
          set -x
          test ! -e /usr/bin/phantom-mirage
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./phantom-mirage_*.deb ./phantom-mirage-common_*.deb
          dpkg -L phantom-mirage
          test "$(command -v phantom-mirage)" = /usr/bin/phantom-mirage
          dpkg -S /usr/bin/phantom-mirage
          # Version comes from AC_INIT in configure.ac only
          want=$(sed -n 's/^AC_INIT(\[phantom-mirage\], \[\([^]]*\)\]).*/\1/p' phantom-mirage/configure.ac)
          test -n "$want"
          phantom-mirage --version 2>&1 | tee version.txt
          grep -qx "Phantom Mirage I $want (based on Honeyd)" version.txt
          test "$(dpkg-query -W -f='${Version}' phantom-mirage)" = "$want-2"
          test "$(dpkg-query -W -f='${Version}' phantom-mirage-common)" = "$want-2"
          test "$want" = 1.7.0
          test -e /etc/phantom-mirage/phantom-mirage.conf
          test -e /usr/share/phantom-mirage/nmap-os-db
          getent passwd phantom-mirage
          # AppArmor profile shipped; this container has no AppArmor and the
          # install above must still have succeeded (#16)
          test -f /etc/apparmor.d/usr.lib.phantom-mirage.pm-script-ns
          test -f /etc/apparmor.d/abstractions/phantom-mirage-script
          ls /usr/lib/*/phantom-mirage/pm-script-ns
          ! command -v apparmor_parser
          # log dir from debian/phantom-mirage.dirs, owned by the daemon user
          test "$(stat -c '%U' /var/log/phantom-mirage)" = phantom-mirage
          # systemd unit: shipped, valid, not enabled (matches --no-start)
          test -f /usr/lib/systemd/system/phantom-mirage.service
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd
          systemd-analyze verify /usr/lib/systemd/system/phantom-mirage.service
          systemd-analyze security --offline=yes /usr/lib/systemd/system/phantom-mirage.service | tail -n 1 || true
          test ! -e /etc/systemd/system/multi-user.target.wants/phantom-mirage.service

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-mirage-deb
          path: |
            src/*.deb
            src/*.buildinfo
            src/*.changes
            src/lintian.txt
          if-no-files-found: error

  systemd:
    name: Ubuntu 24.04 / ${{ matrix.arch }} .deb under systemd
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    # The packaged unit under real systemd (PID 1 on the runner), with its
    # defaults: --sandbox-daemon --sandbox-scripts, ProtectSystem=strict,
    # RestrictNamespaces=user mnt pid ipc uts net (#16).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/phantom-mirage

      - name: Build the .deb on this release
        working-directory: src/phantom-mirage
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs
          sudo mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -us -uc -b

      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu24.04-${{ matrix.arch }}
          path: src/*.deb

      - name: Install it
        working-directory: src
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./phantom-mirage_*.deb ./phantom-mirage-common_*.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 python3
          systemctl cat phantom-mirage

      - name: AppArmor profile is loaded, enforcing
        # Ubuntu's default kernel.apparmor_restrict_unprivileged_userns=1
        # stays on: the shipped profile grants userns to the launcher
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          ls -l /etc/apparmor.d/usr.lib.phantom-mirage.pm-script-ns /etc/apparmor.d/abstractions/phantom-mirage-script /usr/lib/*/phantom-mirage/pm-script-ns
          sudo apparmor_parser -Q -K /etc/apparmor.d/usr.lib.phantom-mirage.pm-script-ns
          sudo aa-status | grep -E 'pm-script-ns|phantom-mirage-script'

      - name: Run the service (ci/systemd_unit.sh)
        # The launcher is traced with strace for the syscall audit. AppArmor
        # mediates ptrace on the traced side too, so CI (only) lets the
        # unconfined tracer in via the profiles' local/ includes.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace
          for f in usr.lib.phantom-mirage.pm-script-ns phantom-mirage-script; do
            echo 'ptrace (tracedby, readby) peer=unconfined,' | sudo tee -a /etc/apparmor.d/local/$f
          done
          sudo apparmor_parser -r -K /etc/apparmor.d/usr.lib.phantom-mirage.pm-script-ns
          mkdir -p lt
          sudo HD_APPARMOR=require HD_LTRACE=$PWD/lt bash src/phantom-mirage/ci/systemd_unit.sh

      - name: Existing service scripts in the read-only root (systemd)
        run: |
          since=$(date '+%Y-%m-%d %H:%M:%S')
          sudo systemctl start phantom-mirage; sleep 3
          sudo HD_SYSTEMD=1 bash src/phantom-mirage/ci/ns_services.sh
          sudo systemctl stop phantom-mirage
          ! sudo journalctl -u phantom-mirage --since "$since" --no-pager | grep -E 'denied syscall|killed by SIGSYS|read-only root:|not running it'
          ! sudo journalctl -k --since "$since" --no-pager | grep -E 'apparmor="(DENIED|ALLOWED)"'

      - name: Syscall audit of the launcher allowlist
        run: |
          ls lt
          sudo bash src/phantom-mirage/ci/syscall_audit.sh --launcher lt/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kernel log (AppArmor)
        if: always()
        run: sudo journalctl -k --no-pager | grep -i apparmor | tail -n 50 || true

      - name: Journal
        if: always()
        run: sudo journalctl -u phantom-mirage --no-pager | tail -n 200

  arm64:
    name: Debian 13 / arm64 --sandbox-daemon
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    # Native arm64 runner: under QEMU user emulation (the Docker job)
    # the guest's seccomp filter is not supported (qemu-user refuses
    # PR_SET_SECCOMP), so --sandbox-daemon can only be checked natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    container:
      image: debian:13
      # NET_ADMIN: routes/veth; SYS_ADMIN: regress/nmap.py namespace
      options: --cap-add=NET_ADMIN --cap-add=SYS_ADMIN --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            python3-dev python3-dpkt iproute2 procps util-linux strace nmap diffutils

      - name: Build (--with-python)
        run: |
          ./autogen.sh
          ./configure --prefix=/usr --with-python
          grep -q '^#define HAVE_PYTHON 1' config.h
          make -j$(nproc)
          uname -m | tee -a "$GITHUB_STEP_SUMMARY"
          install -D -m 755 libphantom-mirage.so /usr/lib/phantom-mirage/libphantom-mirage.so
          gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c

      - name: strace audit of the allowlist (arm64)
        # Run the services and the regress/ suite without the filter under
        # strace -f and check every call they make is on the allowlist as
        # compiled for arm64 (no legacy open/poll/select/stat/fork here).
        shell: bash
        run: |
          mkdir -p st learn-logs
          HD_LEARN=1 HD_WRAP="strace -f -qq -o $PWD/st/sd" HD_LOGDIR=$PWD/learn-logs \
            bash ci/sandbox_daemon.sh || true
          mv phantom-mirage honeyd.real
          printf '#!/bin/sh\nexec strace -f -qq -o %s/st/r.$$ %s/honeyd.real "$@"\n' "$PWD" "$PWD" > phantom-mirage
          chmod +x phantom-mirage
          (cd regress && for t in general.py detect.py routing.py nmap.py; do
             timeout -k 10 300 python3 $t > ../learn-logs/regress-${t%.py}.log 2>&1 || true
           done)
          mv honeyd.real phantom-mirage
          ls st | wc -l
          ci/syscall_audit.sh st/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "--sandbox-daemon: services + regress/ under the allowlist (arm64)"
        shell: bash
        env:
          HD_LANDLOCK: require
        run: |
          bash ci/sandbox_daemon.sh
          bash ci/pidfile.sh
          bash ci/script_ns.sh
          cd regress
          bad=0
          for t in general.py detect.py routing.py nmap.py; do
            log="../regress-sbd-${t%.py}.log"
            set +e; REGRESS_PHANTOM_MIRAGE_ARGS=--sandbox-daemon timeout -k 10 300 \
              python3 "$t" -d > "$log" 2>&1; rc=$?; set -e
            tail -5 "$log"
            [ $rc = 0 ] || { echo "$t: rc=$rc" >&2; bad=1; }
            grep -q 'sandbox-daemon: seccomp allowlist active' "$log" || { echo "$t: filter not active" >&2; bad=1; }
            if grep -E 'sandbox-daemon: denied syscall|killed by SIGSYS' "$log"; then bad=1; fi
          done
          exit $bad

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-sandbox-daemon
          path: |
            sandbox-daemon-*.log
            learn-logs/*.log
            regress-sbd-*.log
            regress/nmap.log
          if-no-files-found: ignore

  script-ns:
    name: Ubuntu 24.04 / ${{ matrix.arch }} --sandbox-scripts namespaces
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    # Directly on the runner, not in a container: Docker's default
    # AppArmor profile refuses the mounts a private /tmp needs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            iproute2 procps python3

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them for unconfined programs by default
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          uname -r; cat /sys/kernel/security/lsm || true

      - name: "--sandbox-scripts: per-script namespaces (#16)"
        run: |
          mkdir -p ns-logs
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace
          mkdir -p lt
          sudo HD_NS=require HD_LOGDIR=$PWD/ns-logs HD_LTRACE=$PWD/lt bash ci/script_ns.sh
          ls lt
          sudo bash ci/syscall_audit.sh --launcher lt/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Existing service scripts in the read-only root
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends perl util-linux
          sudo HD_LOGDIR=$PWD/ns-logs bash ci/ns_services.sh

      - name: "Fallback is logged when user namespaces are off"
        run: |
          sudo sysctl -w user.max_user_namespaces=0
          sudo HD_LOGDIR=$PWD/ns-logs bash ci/script_ns.sh
          grep -q 'unprivileged user namespaces unavailable' ns-logs/script-ns-scripts.log
          sudo sysctl -w user.max_user_namespaces=63000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-ns-${{ matrix.arch }}
          path: ns-logs/

  docker:
    name: Docker image (amd64 + arm64)
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (no push)
        # Nothing is pushed anywhere; this only proves both architectures
        # build. Signing and a private registry come later (#20).
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: phantom-mirage:ci
          cache-from: type=gha

      - name: Smoke test amd64 image
        run: |
          set -x
          caps="--cap-drop ALL --cap-add NET_RAW --cap-add NET_ADMIN --cap-add SETUID --cap-add SETGID"
          ro="--read-only --tmpfs /run --tmpfs /tmp --tmpfs /root/.config --security-opt no-new-privileges"
          docker run --rm $caps $ro phantom-mirage:ci --version
          docker run --rm $caps $ro phantom-mirage:ci --verify-config
          docker run --rm $caps $ro -v "$PWD/ci/smoke.conf:/etc/phantom-mirage/phantom-mirage.conf:ro" phantom-mirage:ci --verify-config
          # A broken config must stop the entrypoint before the daemon starts
          printf 'create x\nset x personality "Nope"\n' > /tmp/bad.conf
          if docker run --rm $caps $ro -v /tmp/bad.conf:/etc/phantom-mirage/phantom-mirage.conf:ro phantom-mirage:ci; then
            echo "bad config was accepted" >&2; exit 1
          fi
          # Daemon starts, drops privileges, control socket is locked down
          cid=$(docker run -d $caps $ro phantom-mirage:ci)
          sleep 5
          docker exec "$cid" stat -c '%a %U %n' /run/phantom-mirage /run/phantom-mirage/phantom-mirage.sock
          test "$(docker exec "$cid" stat -c '%a' /run/phantom-mirage/phantom-mirage.sock)" = 600
          # pid file next to the socket, root 0644, naming the daemon (pid 1)
          test "$(docker exec "$cid" stat -c '%a %u' /run/phantom-mirage/phantom-mirage.pid)" = "644 0"
          test "$(docker exec "$cid" cat /run/phantom-mirage/phantom-mirage.pid)" = 1
          docker exec "$cid" sh -c 'echo "list template" | phantom-mirage-ctl' | grep -q 192.0.2.10
          docker exec "$cid" grep -q '^Uid:.*65534' /proc/1/status
          # #16: every ID 65534, no effective/permitted/ambient caps,
          # no_new_privs (bounding set stays: no CAP_SETPCAP here)
          docker exec "$cid" grep -E '^(Uid|Gid|Groups|Cap|NoNewPrivs|Seccomp)' /proc/1/status
          docker exec "$cid" grep -Eq '^Uid:\s+65534\s+65534\s+65534\s+65534$' /proc/1/status
          docker exec "$cid" grep -Eq '^Gid:\s+65534\s+65534\s+65534\s+65534$' /proc/1/status
          for c in CapInh CapPrm CapEff CapAmb; do
            docker exec "$cid" grep -Eq "^$c:\s+0+$" /proc/1/status
          done
          docker exec "$cid" grep -Eq '^NoNewPrivs:\s+1$' /proc/1/status
          docker rm -f "$cid"
          # --sandbox-scripts starts in the image too (Landlock/seccomp
          # under Docker's default seccomp profile)
          cid=$(docker run -d $caps $ro phantom-mirage:ci --sandbox-scripts)
          sleep 5
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--sandbox-scripts'
          docker exec "$cid" grep -Eq '^NoNewPrivs:\s+1$' /proc/1/status
          docker logs "$cid"
          docker rm -f "$cid"
          # PHANTOM_MIRAGE_JSON_LOG=stdout passes --json-log=- to phantom-mirage (#24)
          cid=$(docker run -d $caps $ro -e PHANTOM_MIRAGE_JSON_LOG=stdout \
            -e PHANTOM_MIRAGE_SENSOR_ID=docker-ci -e PHANTOM_MIRAGE_HEARTBEAT=1 phantom-mirage:ci)
          sleep 5
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--json-log=-'
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--sensor-id=docker-ci'
          docker logs "$cid" 2>/dev/null | grep -q '"event":"heartbeat","sensor_id":"docker-ci"'
          docker exec "$cid" grep -q '^Uid:.*65534' /proc/1/status
          docker logs "$cid"
          docker rm -f "$cid"
          docker image ls phantom-mirage:ci --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Sandbox checks inside the image: daemon + --sandbox-scripts (#16)"
        run: bash ci/docker_sandbox.sh phantom-mirage:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-sandbox-amd64
          path: docker-sandbox-logs/
          if-no-files-found: ignore

  docker-arm64:
    name: Docker image / arm64 native sandbox checks
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    # Native arm64 runner: under QEMU (the docker job) the guest's seccomp
    # filters are not supported, so the arm64 image is checked here.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Load arm64 image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: phantom-mirage:ci
          cache-from: type=gha

      - name: "Sandbox checks inside the image: daemon + --sandbox-scripts (#16)"
        run: bash ci/docker_sandbox.sh phantom-mirage:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-sandbox-arm64
          path: docker-sandbox-logs/
          if-no-files-found: ignore

  ubuntu2604:
    name: Ubuntu 26.04 / ${{ matrix.arch }} .deb (container)
    # No 26.04 runners yet: ubuntu:26.04 containers on the 24.04 runners
    # (host kernel and AppArmor are the runner's 24.04 ones).
    needs: systemd
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/phantom-mirage

      - name: The 24.04-built .deb installs on 26.04
        uses: actions/download-artifact@v4
        with:
          name: deb-ubuntu24.04-${{ matrix.arch }}
          path: deb2404

      - name: Install the 24.04 .deb in ubuntu:26.04
        run: |
          docker run --rm -v "$PWD/deb2404:/d:ro" ubuntu:26.04 bash -ec '
            . /etc/os-release; echo "$PRETTY_NAME"
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /d/phantom-mirage_*.deb /d/phantom-mirage-common_*.deb
            dpkg -s phantom-mirage | grep -E "^(Version|Depends):"
            phantom-mirage --version
            ldd /usr/bin/phantom-mirage | grep -E "not found" && exit 1 || true' 2>&1 | tee install2404.log

      - name: Build, install and sandbox-test in ubuntu:26.04
        # NET_ADMIN: routes on lo; NET_RAW: pcap.
        # Docker's default AppArmor stays on, so per-script namespaces fall
        # back (logged); the namespace + systemd checks run on the hosts.
        run: |
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/src:/src" -w /src/phantom-mirage ubuntu:26.04 bash -ec '
            . /etc/os-release; echo "$PRETTY_NAME"; uname -r
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential devscripts equivs python3-dev python3-dpkt iproute2 procps util-linux
            mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
            dpkg-buildpackage -us -uc -b
            DEBIAN_FRONTEND=noninteractive apt-get install -y ../phantom-mirage_*.deb ../phantom-mirage-common_*.deb
            dpkg -s phantom-mirage | grep -E "^(Version|Depends):"
            phantom-mirage --version
            # sandbox smoke tests from a --with-python build tree
            ./autogen.sh >/dev/null; ./configure -q --prefix=/usr --with-python
            make -j$(nproc) >/dev/null
            install -D -m 755 libphantom-mirage.so /usr/lib/phantom-mirage/libphantom-mirage.so
            gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c
            HD_LANDLOCK=require bash ci/sandbox_daemon.sh
            bash ci/script_ns.sh
            grep -h "Landlock ABI" sandbox-daemon-plain.log | head -1'
          ls src/*.deb
          v=$(cd src/phantom-mirage && dpkg-parsechangelog -S Version)
          mkdir -p out
          for f in src/*.deb; do
            n=$(basename "$f" | sed -E "s/^([a-z-]+)_.*_([a-z0-9]+)\.deb$/\1_${v}_ubuntu26.04_\2.deb/")
            sudo cp "$f" "out/$n"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-mirage_ubuntu26.04_${{ matrix.arch }}
          path: out/*.deb

  fuzz:
    name: Debian 13 / libFuzzer (smoke)
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:13
    env:
      # Leaks: see the sanitizers job. Every target allocates long-lived
      # state on purpose, so LSan is noise here too.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            clang libclang-rt-dev

      - name: Build fuzz targets
        run: fuzz/build.sh

      - name: Replay seed corpora (gate)
        # Every committed seed must run clean. A regression in a fixed bug
        # fails here.
        run: |
          for t in packet config macprefix; do
            fuzz/out/fuzz_$t -runs=0 fuzz/corpus/$t
          done

      - name: Fuzz each target for 60s (informational)
        # Short exploratory run. Known open findings (see docs/fuzzing.md)
        # can still be hit, so crashes are reported and uploaded rather
        # than failing the build.
        run: |
          mkdir -p fuzz-artifacts
          for t in packet config macprefix; do
            mkdir -p "work/$t"
            cp fuzz/corpus/$t/* "work/$t/"
            # timeout: a stuck fork job must not hold up the build
            timeout -k 10 120 fuzz/out/fuzz_$t -fork=2 -ignore_crashes=1 -max_total_time=60 -timeout=10 \
              -max_len=4096 -artifact_prefix="fuzz-artifacts/$t-" \
              "work/$t" > "fuzz-$t.log" 2>&1 || true
            tail -n 1 "fuzz-$t.log"
            n=$(ls fuzz-artifacts | grep -c "^$t-" || true)
            echo "fuzz_$t: $n crashing input(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload crashing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
