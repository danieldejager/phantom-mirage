name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian13:
    name: Debian 13 / GCC 14
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev

      - name: Toolchain versions
        run: gcc --version | head -1 && autoconf --version | head -1

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          # Python is opt-in (#36): the default build has no libpython
          ! grep -q '^#define HAVE_PYTHON' config.h

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Count compiler warnings
        run: |
          n=$(grep -c "warning:" build.log || true)
          echo "Compiler warnings: $n" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        # Runs from the build tree, before anything is installed.
        run: |
          D=$PWD
          # No /usr/share/honeyd here: honeyd must start without it (#43).
          test ! -e /usr/share/honeyd
          ./honeyd --version
          ./honeyd --verify-config -f $D/ci/smoke.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes
          for b in honeydctl honeydstats hsniff; do test -x ./$b; done

      - name: "make install + run from the installed tree (#36)"
        # make install needs no Python (#36) and must not touch $HOME.
        run: |
          set -x
          make install DESTDIR=$PWD/destdir
          for f in usr/bin/honeyd usr/bin/honeydctl usr/bin/honeydstats \
                   usr/bin/hsniff usr/lib/honeyd/libhoneyd.so \
                   usr/share/honeyd/nmap-os-db usr/share/honeyd/xprobe2.conf \
                   usr/share/honeyd/nmap.assoc usr/share/honeyd/pf.os \
                   usr/share/honeyd/nmap-mac-prefixes \
                   usr/share/honeyd/scripts/lib/names.py \
                   usr/include/honeyd/hooks.h; do
            test -e destdir/$f || { echo "missing $f" >&2; exit 1; }
          done
          test ! -e "$HOME/.config/honeyd"
          make install
          mkdir -p /var/run
          cd /
          # Data files found via the compiled-in defaults, no -p/-x/...
          honeyd --verify-config -f "$GITHUB_WORKSPACE/ci/smoke.conf" -i lo --disable-webserver
          timeout 20 honeyd -d -f "$GITHUB_WORKSPACE/ci/smoke.conf" -i lo \
            --disable-webserver > /tmp/installed.log 2>&1 &
          for i in $(seq 1 20); do
            echo "list template" | timeout 5 honeydctl > /tmp/ctl.out 2>&1 && break
            sleep 0.5
          done
          cat /tmp/ctl.out
          grep -q 10.99.0.10 /tmp/ctl.out
          kill -INT %1 || true
          wait %1 || true
          cat /tmp/installed.log
          grep -q 'Demoting process privileges' /tmp/installed.log
          python3 -c 'import sys; sys.path.insert(0, "/usr/share/honeyd/scripts/lib"); import names' \
            || echo "python3 not installed here; names.py import skipped"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            config.log
            events.jsonl
            honeyd.log
          if-no-files-found: ignore

  sanitizers:
    name: Debian 13 / ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: debian:13
      # NET_ADMIN: the subsystem step routes a honeypot subnet over lo.
      # SYS_ADMIN: regress/nmap.py runs nmap in its own network namespace
      # (unshare --net + nsenter, no mounts).
      options: --cap-add=NET_ADMIN --cap-add=SYS_ADMIN
    env:
      # Findings fail the job. Leak detection is off because honeyd keeps
      # its config, personalities and assoc tables for the whole process
      # lifetime and never frees them on exit (~590 KB in ~14k allocations
      # reported per --verify-config), so LSan output is all noise.
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:detect_leaks=0:print_stacktrace=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            python3-dev

      - name: Configure
        # Makefile.am hard-codes CFLAGS, which overrides a configure-time
        # CFLAGS, so the sanitizer flags go in through CPPFLAGS (used for
        # every compile) and LDFLAGS. The Makefile's -O2 comes after our
        # -O1, so the effective optimisation level is -O2.
        run: |
          ./autogen.sh
          CPPFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" \
          ./configure --prefix=/usr --with-python
          # Embedded Python 3 is on in this job only (#36)
          grep -q '^#define HAVE_PYTHON 1' config.h

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Rebuild libhoneyd.so without sanitizers
        # libhoneyd.so is an LD_PRELOAD shim for unsanitized subsystem
        # binaries. An ASan runtime dependency would break it there
        # (ASan must be first in the link order), so rebuild just the
        # shim's objects without sanitizer flags.
        run: |
          rm -f libhoneyd.so libhoneyd-*.lo .libs/libhoneyd-*.o
          make CPPFLAGS= LDFLAGS= libhoneyd.so
          # ldd misses instrumented objects (undefined __asan_* symbols
          # with no NEEDED entry), so check the symbol table too.
          if ldd libhoneyd.so | grep -E 'libasan|libubsan' ||
             nm -D libhoneyd.so | grep -E ' U __(asan|ubsan)_'; then
            echo "libhoneyd.so is still sanitizer-instrumented" >&2; exit 1
          fi

      - name: Prepare test data
        # No /usr/share/honeyd here: honeyd must start without it (#43).
        run: test ! -e /usr/share/honeyd

      - name: Relative-path smoke test (sanitized, #10/#48)
        # determine_path() turns relative paths into absolute ones; ASan
        # catches any under-allocation regression here.
        run: |
          ./honeyd --verify-config -f ci/smoke.conf -i lo --disable-webserver \
            -p nmap-os-db -x xprobe2.conf -a nmap.assoc \
            -0 pf.os -m nmap-mac-prefixes

      - name: Smoke test (sanitized)
        run: |
          D=$PWD
          ./honeyd --version
          for f in ci/smoke.conf ci/sanitizer.conf; do
            echo "== verify-config $f"
            ./honeyd --verify-config -f $D/$f -i lo --disable-webserver \
              -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
              -0 $D/pf.os -m $D/nmap-mac-prefixes
          done
          # --help/usage exits non-zero in these tools, so check the output
          # for sanitizer reports instead of the exit code.
          for b in honeydctl honeydstats hsniff; do
            echo "== $b --help"
            ./$b --help > $b.out 2>&1 || true
            head -5 $b.out
            if grep -E 'runtime error|ERROR: AddressSanitizer' $b.out; then exit 1; fi
          done

      - name: Control socket lockdown (sanitized, #14)
        # Runs the daemon on lo for a few seconds: the socket dir must be
        # root 0700, the socket 0600, root's honeydctl must work and a
        # non-root peer must be refused (SO_PEERCRED, checked with the
        # permissions opened up so the kernel does not refuse it first).
        run: |
          D=$PWD
          mkdir -p /var/run
          timeout 30 ./honeyd -d -f $D/ci/smoke.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes > honeyd-ui.log 2>&1 &
          for i in $(seq 1 20); do
            test -S /var/run/honeyd/honeyd.sock && break; sleep 0.5
          done
          stat -c '%a %U:%G %F %n' /var/run/honeyd /var/run/honeyd/honeyd.sock
          test "$(stat -c '%a %u' /var/run/honeyd)" = "700 0"
          test "$(stat -c '%a %u %F' /var/run/honeyd/honeyd.sock)" = "600 0 socket"
          echo "list template" | timeout 5 ./honeydctl | tee ctl-root.out
          grep -q '10.99.0.10' ctl-root.out
          chmod 755 /var/run/honeyd; chmod 666 /var/run/honeyd/honeyd.sock
          echo "list template" | timeout 5 setpriv --reuid=65534 --regid=65534 \
            --clear-groups ./honeydctl > ctl-nobody.out 2>&1 || true
          sleep 1
          kill -INT %1 || true
          wait %1 || true
          cat honeyd-ui.log
          if grep -q '10.99.0.10' ctl-nobody.out; then
            echo "non-root peer was served" >&2; exit 1
          fi
          grep -q 'rejected ui connection from .* uid 65534' honeyd-ui.log
          if grep -E 'runtime error|ERROR: AddressSanitizer' honeyd-ui.log; then exit 1; fi

      - name: Subsystem connection + JSON log (sanitized, #22, #24)
        # A TCP connection to a subsystem port used to crash honeyd
        # (event_add(NULL) in cmd_subsystem_schedule_connect). Run a tiny
        # subsystem through the libhoneyd.so shim and connect to it three
        # times over lo.
        # After honeyd drops privileges the sanitizer runtime cannot read
        # /proc/self/environ, so UBSAN_OPTIONS (halt_on_error, suppressions)
        # do not apply to later reports; the log is grepped instead.
        run: |
          D=$PWD
          apt-get install -y --no-install-recommends iproute2 python3 >/dev/null
          install -D -m 755 libhoneyd.so /usr/lib/honeyd/libhoneyd.so
          gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c
          cp ci/svc_escape.sh /tmp/svc_escape.sh
          # honeyd opens its logs after dropping to nobody (#24 docs)
          install -d -m 1777 /tmp/hdlogs
          ip route add 10.99.0.0/24 dev lo
          cat > /tmp/subsys.conf <<'CONF'
          create default
          set default default tcp action block
          create linux
          set linux personality "Linux 2.6.32"
          set linux default tcp action reset
          add linux subsystem "/tmp/subsys_echo"
          add linux tcp port 2323 "/bin/sh /tmp/svc_escape.sh"
          bind 10.99.0.10 linux
          CONF
          mkdir -p /var/run
          timeout 60 ./honeyd -d -f /tmp/subsys.conf -i lo --disable-webserver \
            -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
            -0 $D/pf.os -m $D/nmap-mac-prefixes \
            -l /tmp/hdlogs/honeyd.log --json-log=/tmp/hdlogs/events.jsonl \
            --sensor-id=ci-sensor-1 --heartbeat=1 \
            > honeyd-sub.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q 'Listen: .*:18080' honeyd-sub.log && break; sleep 0.5
          done
          ok=0
          for i in 1 2 3; do
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'" && ok=$((ok+1))
          done
          # script port: its stderr becomes "service" events
          python3 -c "import socket; s=socket.create_connection(('10.99.0.10',2323),timeout=5); s.recv(1)" || true
          sleep 2
          kill -INT %1 || true
          wait %1 || true
          cat honeyd-sub.log
          if grep -E 'runtime error|ERROR: AddressSanitizer' honeyd-sub.log; then
            exit 1
          fi
          test "$ok" = 3
          test "$(grep -c 'Connection established: .*subsystem' honeyd-sub.log)" = 3
          # Text log still written as before; JSON log valid with the schema
          grep -q 'tcp(6) S ' /tmp/hdlogs/honeyd.log
          cp /tmp/hdlogs/events.jsonl /tmp/hdlogs/honeyd.log .
          python3 ci/check_json_log.py events.jsonl ci-sensor-1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Embedded Python 3 service script (sanitized, #36)
        # honeyd built --with-python; an "internal" Python 3 service
        # (scripts/python/echo_banner.py) answers three connections over lo,
        # honeyd.log() reaches the service log, honeydctl "!" runs Python,
        # and the read-only status page (webserver/) answers on 127.0.0.1.
        # Uses the 10.99.0.0/24 route over lo from the subsystem step.
        shell: bash
        run: |
          python3 ci/test_webserver.py
          ci/python_service.sh

      - name: Python 3 service scripts under scripts/ (#36)
        # Canned SMB/TDS/MySQL/NBNS/mDNS requests over stdin/stdout get a
        # sane reply; non-UTF-8 bytes, NULs, truncated and random packets
        # must not crash, hang or traceback.
        run: python3 ci/test_scripts.py

      - name: Privilege hardening + script sandbox (sanitized, #16)
        # Default: honeyd and every script child run with all IDs 65534,
        # no capabilities (incl. bounding/ambient), no_new_privs.
        # --sandbox-scripts: script children also get Landlock + seccomp.
        # SIGHUP/SIGUSR1 must keep working with the hardened process.
        shell: bash
        run: |
          D=$PWD
          apt-get install -y --no-install-recommends procps util-linux >/dev/null
          install -d -m 755 /tmp/hdsb
          install -d -m 1777 /tmp/hdsb/tmp /tmp/hdsb/rw
          install -m 755 ci/sandbox_probe.sh /tmp/hdsb/sandbox_probe.sh
          cat > /tmp/hdsb/sb.conf <<'CONF'
          create default
          set default default tcp action block
          create linux
          set linux personality "Linux 2.6.32"
          set linux default tcp action reset
          add linux subsystem "/tmp/subsys_echo"
          add linux tcp port 2325 "/bin/sh /tmp/hdsb/sandbox_probe.sh"
          bind 10.99.0.10 linux
          CONF
          run() {
            mode=$1; shift
            rm -f /tmp/hdsb/tmp/* /tmp/hdsb/rw/*
            timeout 60 ./honeyd -d -f /tmp/hdsb/sb.conf -i lo --disable-webserver \
              -p $D/nmap-os-db -x $D/xprobe2.conf -a $D/nmap.assoc \
              -0 $D/pf.os -m $D/nmap-mac-prefixes "$@" > sb-$mode.log 2>&1 &
            hp=$!
            for i in $(seq 1 30); do
              grep -q 'Listen: .*:18080' sb-$mode.log && break; sleep 0.5
            done
            # $hp is timeout(1); signal and inspect honeyd itself
            hd=$(pgrep -n -P $hp -x honeyd)
            ll=""
            grep -q 'Landlock unavailable' sb-$mode.log && ll=no-landlock || true
            python3 ci/check_sandbox.py $mode $hd $ll | tee -a "$GITHUB_STEP_SUMMARY"
            rc=${PIPESTATUS[0]}
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'"
            kill -HUP $hd; sleep 1; kill -USR1 $hd; sleep 1
            kill -0 $hd
            grep -q 'rereading configuration' sb-$mode.log
            python3 -c "import socket; s=socket.create_connection(('10.99.0.10',18080),timeout=5); assert s.recv(16)==b'hello\\n'"
            kill -INT $hd || true
            wait $hp || true
            cat sb-$mode.log
            ! grep -E 'runtime error|ERROR: AddressSanitizer|sandbox: .*(failed|remain|not dropped)' sb-$mode.log
            return $rc
          }
          echo "### default" >> "$GITHUB_STEP_SUMMARY"
          run default
          echo "### --sandbox-scripts" >> "$GITHUB_STEP_SUMMARY"
          run sandbox --sandbox-scripts --sandbox-allow-write=/tmp/hdsb/rw

      - name: "regress/ suite (gating, veth pair, #36 #74)"
        # Deterministic since #74: veth pair instead of lo, -R seeds all
        # of honeyd's randomness, the harness masks only wall-clock and
        # kernel-chosen fields (regress/IMPORTANT_NOTES.txt). Runs the
        # suite 3 times; any mismatch or harness error fails the job.
        # nmap.py runs real nmap -O against fixed personalities.
        shell: bash
        run: |
          apt-get install -y --no-install-recommends python3-dpkt diffutils nmap >/dev/null
          cd regress
          echo "### regress/ (gating)" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for run in 1 2 3; do
            for t in general.py detect.py routing.py nmap.py; do
              log="../regress-${t%.py}-$run.log"
              set +e; timeout -k 10 300 python3 "$t" > "$log" 2>&1; rc=$?; set -e
              cat "$log"
              case $rc in
                0) r="all match" ;;
                3) r="MISMATCH"; bad=1 ;;
                *) r="HARNESS ERROR rc=$rc"; bad=1 ;;
              esac
              echo "- run $run \`$t\`: $r — $(grep -E '^  (OK|FAILED)' "$log" | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          if grep -E 'runtime error|ERROR: AddressSanitizer' ../regress-*.log; then bad=1; fi
          exit $bad

      - name: "--sandbox-daemon: suites under the daemon seccomp allowlist (#16)"
        # Same services as above (subsystem, shell script, Python 3
        # service, status page, honeydctl, SIGHUP/SIGUSR1, plus
        # --sandbox-scripts), then the regress/ suite incl. nmap.py, with
        # honeyd confined to its syscall allowlist. A denied call logs
        # "sandbox-daemon: denied syscall N" (daemon) or "killed by
        # SIGSYS" (child) and fails the step; ci/sandbox_daemon.sh also
        # checks that an off-list call (mount) is caught.
        shell: bash
        run: |
          bash ci/sandbox_daemon.sh
          # Again as under debian/honeyd.service: no_new_privs, the unit's
          # capability bounding set, writable state only below /run.
          # (ProtectSystem=strict needs mounts, which the CI container
          # refuses; it was checked by hand, see docs/sandboxing.md.)
          mkdir -p unit-logs
          HD_WRAP="setpriv --no-new-privs --inh-caps=-all --bounding-set=-all,+net_raw,+net_admin,+setuid,+setgid" \
            HD_WORK=/run/hdsd HD_LOGDIR=$PWD/unit-logs bash ci/sandbox_daemon.sh
          cd regress
          bad=0
          for t in general.py detect.py routing.py nmap.py; do
            log="../regress-sbd-${t%.py}.log"
            set +e; REGRESS_HONEYD_ARGS=--sandbox-daemon timeout -k 10 300 \
              python3 "$t" -d > "$log" 2>&1; rc=$?; set -e
            tail -5 "$log"
            [ $rc = 0 ] || { echo "$t: rc=$rc" >&2; bad=1; }
            grep -q 'sandbox-daemon: seccomp allowlist active' "$log" || { echo "$t: filter not active" >&2; bad=1; }
            if grep -E 'sandbox-daemon: denied syscall|killed by SIGSYS' "$log"; then bad=1; fi
          done
          exit $bad

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-sanitizers
          path: |
            build.log
            config.log
            events.jsonl
            honeyd.log
            regress-*.log
            regress/nmap.log
            sandbox-daemon-*.log
            unit-logs/*.log
            honeyd-py*.log
            honeyd-py-ctl.out
          if-no-files-found: ignore

  deb:
    name: Debian 13 / .deb package
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/honeyd

      - name: Install packaging tools and build-deps
        working-directory: src/honeyd
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs lintian
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: dpkg-buildpackage -us -uc -b
        working-directory: src/honeyd
        run: dpkg-buildpackage -us -uc -b

      - name: lintian (report only)
        working-directory: src
        run: |
          lintian --info --display-info *.changes 2>&1 | tee lintian.txt || true
          { echo '### lintian'; echo '```'; cat lintian.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the .deb with apt and run it
        working-directory: src
        run: |
          set -x
          test ! -e /usr/bin/honeyd
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./honeyd_*.deb ./honeyd-common_*.deb
          dpkg -L honeyd
          test "$(command -v honeyd)" = /usr/bin/honeyd
          dpkg -S /usr/bin/honeyd
          honeyd --version
          test -e /etc/honeypot/honeyd.conf
          test -e /usr/share/honeyd/nmap-os-db
          getent passwd honeyd
          # systemd unit: shipped, valid, not enabled (matches --no-start)
          test -f /usr/lib/systemd/system/honeyd.service
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd
          systemd-analyze verify /usr/lib/systemd/system/honeyd.service
          systemd-analyze security --offline=yes /usr/lib/systemd/system/honeyd.service | tail -n 1 || true
          test ! -e /etc/systemd/system/multi-user.target.wants/honeyd.service

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeyd-deb
          path: |
            src/*.deb
            src/*.buildinfo
            src/*.changes
            src/lintian.txt
          if-no-files-found: error

  arm64:
    name: Debian 13 / arm64 --sandbox-daemon
    # Native arm64 runner: under QEMU user emulation (the Docker job)
    # the guest's seccomp filter is not supported (qemu-user refuses
    # PR_SET_SECCOMP), so --sandbox-daemon can only be checked natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    container:
      image: debian:13
      # NET_ADMIN: routes/veth; SYS_ADMIN: regress/nmap.py namespace
      options: --cap-add=NET_ADMIN --cap-add=SYS_ADMIN --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            python3-dev python3-dpkt iproute2 procps util-linux strace nmap diffutils

      - name: Build (--with-python)
        run: |
          ./autogen.sh
          ./configure --prefix=/usr --with-python
          grep -q '^#define HAVE_PYTHON 1' config.h
          make -j$(nproc)
          uname -m | tee -a "$GITHUB_STEP_SUMMARY"
          install -D -m 755 libhoneyd.so /usr/lib/honeyd/libhoneyd.so
          gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c

      - name: strace audit of the allowlist (arm64)
        # Run the services and the regress/ suite without the filter under
        # strace -f and check every call they make is on the allowlist as
        # compiled for arm64 (no legacy open/poll/select/stat/fork here).
        shell: bash
        run: |
          mkdir -p st learn-logs
          HD_LEARN=1 HD_WRAP="strace -f -qq -o $PWD/st/sd" HD_LOGDIR=$PWD/learn-logs \
            bash ci/sandbox_daemon.sh || true
          mv honeyd honeyd.real
          printf '#!/bin/sh\nexec strace -f -qq -o %s/st/r.$$ %s/honeyd.real "$@"\n' "$PWD" "$PWD" > honeyd
          chmod +x honeyd
          (cd regress && for t in general.py detect.py routing.py nmap.py; do
             timeout -k 10 300 python3 $t > ../learn-logs/regress-${t%.py}.log 2>&1 || true
           done)
          mv honeyd.real honeyd
          ls st | wc -l
          ci/syscall_audit.sh st/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "--sandbox-daemon: services + regress/ under the allowlist (arm64)"
        shell: bash
        run: |
          bash ci/sandbox_daemon.sh
          cd regress
          bad=0
          for t in general.py detect.py routing.py nmap.py; do
            log="../regress-sbd-${t%.py}.log"
            set +e; REGRESS_HONEYD_ARGS=--sandbox-daemon timeout -k 10 300 \
              python3 "$t" -d > "$log" 2>&1; rc=$?; set -e
            tail -5 "$log"
            [ $rc = 0 ] || { echo "$t: rc=$rc" >&2; bad=1; }
            grep -q 'sandbox-daemon: seccomp allowlist active' "$log" || { echo "$t: filter not active" >&2; bad=1; }
            if grep -E 'sandbox-daemon: denied syscall|killed by SIGSYS' "$log"; then bad=1; fi
          done
          exit $bad

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-sandbox-daemon
          path: |
            sandbox-daemon-*.log
            learn-logs/*.log
            regress-sbd-*.log
            regress/nmap.log
          if-no-files-found: ignore

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (no push)
        # Nothing is pushed anywhere; this only proves both architectures
        # build. Signing and a private registry come later (#20).
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: honeyd:ci
          cache-from: type=gha

      - name: Smoke test amd64 image
        run: |
          set -x
          caps="--cap-drop ALL --cap-add NET_RAW --cap-add NET_ADMIN --cap-add SETUID --cap-add SETGID"
          ro="--read-only --tmpfs /run --tmpfs /tmp --tmpfs /root/.config --security-opt no-new-privileges"
          docker run --rm $caps $ro honeyd:ci --version
          docker run --rm $caps $ro honeyd:ci --verify-config
          docker run --rm $caps $ro -v "$PWD/ci/smoke.conf:/etc/honeyd/honeyd.conf:ro" honeyd:ci --verify-config
          # A broken config must stop the entrypoint before the daemon starts
          printf 'create x\nset x personality "Nope"\n' > /tmp/bad.conf
          if docker run --rm $caps $ro -v /tmp/bad.conf:/etc/honeyd/honeyd.conf:ro honeyd:ci; then
            echo "bad config was accepted" >&2; exit 1
          fi
          # Daemon starts, drops privileges, control socket is locked down
          cid=$(docker run -d $caps $ro honeyd:ci)
          sleep 5
          docker exec "$cid" stat -c '%a %U %n' /run/honeyd /run/honeyd/honeyd.sock
          test "$(docker exec "$cid" stat -c '%a' /run/honeyd/honeyd.sock)" = 600
          docker exec "$cid" sh -c 'echo "list template" | honeydctl' | grep -q 192.0.2.10
          docker exec "$cid" grep -q '^Uid:.*65534' /proc/1/status
          # #16: every ID 65534, no effective/permitted/ambient caps,
          # no_new_privs (bounding set stays: no CAP_SETPCAP here)
          docker exec "$cid" grep -E '^(Uid|Gid|Groups|Cap|NoNewPrivs|Seccomp)' /proc/1/status
          docker exec "$cid" grep -Eq '^Uid:\s+65534\s+65534\s+65534\s+65534$' /proc/1/status
          docker exec "$cid" grep -Eq '^Gid:\s+65534\s+65534\s+65534\s+65534$' /proc/1/status
          for c in CapInh CapPrm CapEff CapAmb; do
            docker exec "$cid" grep -Eq "^$c:\s+0+$" /proc/1/status
          done
          docker exec "$cid" grep -Eq '^NoNewPrivs:\s+1$' /proc/1/status
          docker rm -f "$cid"
          # --sandbox-scripts starts in the image too (Landlock/seccomp
          # under Docker's default seccomp profile)
          cid=$(docker run -d $caps $ro honeyd:ci --sandbox-scripts)
          sleep 5
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--sandbox-scripts'
          docker exec "$cid" grep -Eq '^NoNewPrivs:\s+1$' /proc/1/status
          docker logs "$cid"
          docker rm -f "$cid"
          # HONEYD_JSON_LOG=stdout passes --json-log=- to honeyd (#24)
          cid=$(docker run -d $caps $ro -e HONEYD_JSON_LOG=stdout \
            -e HONEYD_SENSOR_ID=docker-ci -e HONEYD_HEARTBEAT=1 honeyd:ci)
          sleep 5
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--json-log=-'
          docker exec "$cid" sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q -- '--sensor-id=docker-ci'
          docker logs "$cid" 2>/dev/null | grep -q '"event":"heartbeat","sensor_id":"docker-ci"'
          docker exec "$cid" grep -q '^Uid:.*65534' /proc/1/status
          docker logs "$cid"
          docker rm -f "$cid"
          docker image ls honeyd:ci --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Debian 13 / libFuzzer (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:13
    env:
      # Leaks: see the sanitizers job. Every target allocates long-lived
      # state on purpose, so LSan is noise here too.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex pkg-config \
            libpcap-dev libevent-dev libdumbnet-dev zlib1g-dev libedit-dev \
            clang libclang-rt-dev

      - name: Build fuzz targets
        run: fuzz/build.sh

      - name: Replay seed corpora (gate)
        # Every committed seed must run clean. A regression in a fixed bug
        # fails here.
        run: |
          for t in packet config macprefix; do
            fuzz/out/fuzz_$t -runs=0 fuzz/corpus/$t
          done

      - name: Fuzz each target for 60s (informational)
        # Short exploratory run. Known open findings (see docs/fuzzing.md)
        # can still be hit, so crashes are reported and uploaded rather
        # than failing the build.
        run: |
          mkdir -p fuzz-artifacts
          for t in packet config macprefix; do
            mkdir -p "work/$t"
            cp fuzz/corpus/$t/* "work/$t/"
            # timeout: a stuck fork job must not hold up the build
            timeout -k 10 120 fuzz/out/fuzz_$t -fork=2 -ignore_crashes=1 -max_total_time=60 -timeout=10 \
              -max_len=4096 -artifact_prefix="fuzz-artifacts/$t-" \
              "work/$t" > "fuzz-$t.log" 2>&1 || true
            tail -n 1 "fuzz-$t.log"
            n=$(ls fuzz-artifacts | grep -c "^$t-" || true)
            echo "fuzz_$t: $n crashing input(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload crashing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
