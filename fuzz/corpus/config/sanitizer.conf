# Parser coverage for the ASan/UBSan CI job. No ethernet addresses or
# routing to real interfaces, so it verifies on a bare `lo`.
create default
set default default tcp action block
set default default udp action block
set default default icmp action block

create linux
set linux personality "Linux 2.6.32"
set linux uptime 1728650
set linux maxfds 35
set linux default tcp action reset
set linux default udp action reset
add linux tcp port 22 open
add linux tcp port 80 "sh scripts/web.sh"
add linux tcp port 23 proxy $ipsrc:23
add linux tcp port 25 block
add linux udp port 53 open
add linux udp port 161 reset
set linux uid 32767 gid 32767
bind 10.99.0.10 linux

create windows
set windows personality "Microsoft Windows XP Professional SP1"
set windows default tcp action reset
add windows tcp port 135 open
add windows tcp port 139 open
add windows tcp port 445 open
bind 10.99.0.11 windows

create bsd
set bsd personality "FreeBSD 4.10-RELEASE"
add bsd tcp port 22 open
clone bsd2 bsd
bind 10.99.0.12 bsd
bind 10.99.0.13 bsd2

route entry 10.99.0.1
route 10.99.0.1 link 10.99.0.0/24
