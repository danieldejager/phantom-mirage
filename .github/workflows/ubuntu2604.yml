name: ubuntu-26.04

# Ubuntu 26.04 readiness on native runners (amd64 + arm64): build the .deb
# on 26.04, install it, run the packaged unit under real systemd with
# AppArmor, and the sandbox suites from a --with-python build tree.
# CI minutes: manual dispatch, or a PR labelled "full-ci" or
# "ci-ubuntu-26.04" (this workflow only), only.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ubuntu2604-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu2604:
    name: Ubuntu 26.04 / ${{ matrix.arch }} .deb + sandbox
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci' || github.event.label.name == 'ci-ubuntu-26.04'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/phantom-mirage

      - name: System
        run: |
          . /etc/os-release; echo "$PRETTY_NAME $(uname -m) kernel $(uname -r)" | tee -a "$GITHUB_STEP_SUMMARY"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          python3 --version; gcc --version | head -1

      - name: Build the .deb on 26.04
        working-directory: src/phantom-mirage
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs
          sudo mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -us -uc -b

      - name: Install it (with rrdtool, so traffic graphs are on)
        working-directory: src
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./phantom-mirage_*.deb ./phantom-mirage-common_*.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 python3 rrdtool strace
          dpkg -s phantom-mirage | grep -E '^(Version|Depends):' | tee -a "$GITHUB_STEP_SUMMARY"
          ls -ld /var/lib/phantom-mirage/graphs /usr/share/phantom-mirage/webserver/htdocs/graphs
          test "$(stat -c %U /var/lib/phantom-mirage/graphs)" = phantom-mirage

      - name: AppArmor profile loaded; packaged unit under systemd
        run: |
          sudo apparmor_parser -Q -K /etc/apparmor.d/usr.lib.phantom-mirage.pm-script-ns
          sudo aa-status | grep -E 'pm-script-ns|phantom-mirage-script'
          sudo HD_APPARMOR=require bash src/phantom-mirage/ci/systemd_unit.sh
          ! sudo journalctl -u phantom-mirage --no-pager | grep -E 'denied syscall|killed by SIGSYS|read-only root:|not running it|Landlock writable:.* /tmp( |$)'

      - name: Sandbox suites from a --with-python build tree
        # Landlock must be active and never grant /tmp; script namespaces
        # required (the build tree has no AppArmor profile, hence the sysctl)
        working-directory: src/phantom-mirage
        env:
          HD_LANDLOCK: require
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-dev python3-dpkt procps util-linux
          git clean -fdxq
          ./autogen.sh >/dev/null && ./configure -q --prefix=/usr --with-python
          grep -q '^#define HAVE_PYTHON 1' config.h
          grep -q '^#define PATH_RRDTOOL "/usr/bin/rrdtool"' config.h || grep PATH_RRDTOOL Makefile | head -1
          make -j"$(nproc)" >/dev/null
          sudo install -D -m 755 libphantom-mirage.so /usr/lib/phantom-mirage/libphantom-mirage.so
          gcc -O1 -o /tmp/subsys_echo ci/subsys_echo.c
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p logs
          sudo -E HD_LOGDIR=$PWD/logs bash ci/sandbox_daemon.sh
          sudo HD_NS=require HD_LOGDIR=$PWD/logs bash ci/script_ns.sh
          grep -h 'Landlock ABI\|Landlock writable' logs/sandbox-daemon-*.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the .debs
        if: always()
        run: |
          v=$(cd src/phantom-mirage && dpkg-parsechangelog -S Version)
          mkdir -p out
          for f in src/*.deb; do
            [ -e "$f" ] || continue
            n=$(basename "$f" | sed -E "s/^([a-z-]+)_[^_]+_([a-z0-9]+)\.deb$/\1_${v}_ubuntu26.04_\2.deb/")
            cp "$f" "out/$n"
          done
          ls -l out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the ubuntu26.04 .run (release/make-run.sh)
        run: |
          mkdir -p run
          sh src/phantom-mirage/release/make-run.sh out ubuntu26.04 ${{ matrix.arch }} run
          (cd run && sha256sum *.run | tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-mirage-run-ubuntu26.04-${{ matrix.arch }}
          path: run/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phantom-mirage_ubuntu26.04_${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-ubuntu26.04-${{ matrix.arch }}
          path: src/phantom-mirage/logs/
          if-no-files-found: ignore

      - name: Journal
        if: failure()
        run: sudo journalctl -u phantom-mirage --no-pager | tail -n 100

  e2e:
    # Reproduces #110 end to end on real VMs (systemd as PID 1, no
    # container): the broken v1.7.0-3 install, then the new .run over it.
    name: Ubuntu 26.04 / ${{ matrix.arch }} e2e (.run over ${{ matrix.from }})
    needs: ubuntu2604
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci' || github.event.label.name == 'ci-ubuntu-26.04'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        from: ['1.7.0-2', '1.7.0-3']
        include:
          - arch: arm64
            os: ubuntu-26.04-arm
          - arch: amd64
            os: ubuntu-26.04
          # 1.7.0-2 shipped in release v1.7.0 (no install.sh)
          - from: '1.7.0-2'
            rel: v1.7.0
          - from: '1.7.0-3'
            rel: v1.7.0-3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          name: phantom-mirage-run-ubuntu26.04-${{ matrix.arch }}
          path: run

      - name: veth pair (host veth-h 10.77.0.1/24, netns client 10.77.0.2/24)
        run: |
          sudo ip netns add client
          sudo ip link add veth-h type veth peer name veth-c
          sudo ip link set veth-c netns client
          sudo ip addr add 10.77.0.1/24 dev veth-h
          sudo ip link set veth-h up
          sudo ip netns exec client ip addr add 10.77.0.2/24 dev veth-c
          sudo ip netns exec client ip link set veth-c up
          sudo ip netns exec client ip link set lo up
          sudo ip netns exec client ping -c1 -W2 10.77.0.1

      - name: Install ${{ matrix.from }} from release ${{ matrix.rel }} (may fail to start)
        env:
          FROM: ${{ matrix.from }}
          REL: ${{ matrix.rel }}
        run: |
          gh release download "$REL" -R "$REPO" -D old -p "*_${FROM}_ubuntu26.04_*" -p SHA256SUMS
          ls -l old
          (cd old && grep -E "_${FROM}_ubuntu26\.04_(all|${{ matrix.arch }})\.deb" SHA256SUMS | sha256sum -c)
          rc=0
          if [ -f old/install.sh ] || gh release download "$REL" -R "$REPO" -D old -p install.sh -p phantom-mirage-uninstall 2>/dev/null; then
            sudo sh old/install.sh -i veth-h -n 10.77.0.248/29 > old.txt 2>&1 || rc=$?
          else
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ./old/phantom-mirage-common_${FROM}_ubuntu26.04_all.deb \
              ./old/phantom-mirage_${FROM}_ubuntu26.04_${{ matrix.arch }}.deb > old.txt 2>&1 || rc=$?
          fi
          cat old.txt
          echo "$FROM install exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          dpkg-query -W phantom-mirage phantom-mirage-common
          systemctl is-enabled phantom-mirage || true

      - name: sudo sh <the .run> -i veth-h -n 10.77.0.248/29
        run: |
          set -o pipefail
          run=$(ls run/*.run)
          (cd run && sha256sum -c SHA256SUMS)
          # console answers (#118): name, user, port, time source, tz,
          # retention, password twice; test-only stdin, never an option
          printf '%s\n' e2e-sensor admin 8443 browser UTC 30 'E2e-console-pass-1' 'E2e-console-pass-1' > ans.txt
          sudo PM_TEST_STDIN=1 sh "$run" -i veth-h -n 10.77.0.248/29 < ans.txt 2>&1 | tee new1.txt
          grep -q 'SHA-256 fingerprint' new1.txt
          grep -E "install.sh: old version removed cleanly: .*phantom-mirage=$(echo '${{ matrix.from }}' | sed 's/\./\\./g')" new1.txt
          { echo '### e2e install over ${{ matrix.from }}'; echo '```'; grep -E 'removed cleanly|previous install|farpd|enable' new1.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Services active + enabled; decoy answers ping
        run: |
          sleep 3
          for s in phantom-mirage farpd; do
            echo "$s: $(systemctl is-active $s) $(systemctl is-enabled $s)"
            systemctl is-active --quiet $s
            systemctl is-enabled --quiet $s
          done
          sudo ip netns exec client ping -c3 -W3 10.77.0.248 | tee ping.txt
          grep -q ' 0% packet loss' ping.txt
          sudo ip netns exec client ip neigh show | tee -a ping.txt
          { echo '### ping 10.77.0.248'; echo '```'; cat ping.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Console on 127.0.0.1 only; login works (#118)
        run: |
          for s in phantom-mirage-console phantom-mirage-firewall; do
            systemctl is-active --quiet $s; systemctl is-enabled --quiet $s
          done
          sudo nft list table inet phantom_mirage | tee nft.txt
          grep -q 'tcp dport 8443 drop' nft.txt
          grep -Eq '10.77.0.248/29 tcp dport (\{ )?22( \})? drop' nft.txt
          curl -sfk --max-time 5 https://127.0.0.1:8443/api/health
          # not on the LAN address nor a decoy address, from the client netns
          ! sudo ip netns exec client curl -sk --max-time 5 https://10.77.0.1:8443/api/health
          ! sudo ip netns exec client curl -sk --max-time 5 https://10.77.0.248:8443/api/health
          printf '%s\n' 'E2e-console-pass-1' | python3 ci/console_login.py 8443 admin
          printf '%s\n' 'wrong-password-xx' | python3 ci/console_login.py 8443 admin --expect-fail

      - name: Re-run the .run over the new install
        run: |
          set -o pipefail
          sudo sh run/*.run -i veth-h -n 10.77.0.248/29 < /dev/null 2>&1 | tee new2.txt
          # expected version comes from debian/changelog (no hard-coded -N)
          v=$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog | sed 's/\./\\./g')
          test -n "$v"
          grep -E "install.sh: old version removed cleanly: .*phantom-mirage=$v" new2.txt
          grep -q 'kept the web console admin account' new2.txt
          sleep 3
          for s in phantom-mirage farpd; do
            systemctl is-active --quiet $s
            systemctl is-enabled --quiet $s
          done
          sudo ip netns exec client ping -c3 -W3 10.77.0.248
          # upgrade kept the admin account (same password still works)
          systemctl is-active --quiet phantom-mirage-console
          printf '%s\n' 'E2e-console-pass-1' | python3 ci/console_login.py 8443 admin

      - name: phantom-mirage-uninstall --yes
        run: |
          sudo phantom-mirage-uninstall --yes
          for p in phantom-mirage phantom-mirage-common; do
            st=$(dpkg-query -W -f='${db:Status-Abbrev}' $p 2>/dev/null || true)
            case $st in ''|un*|pn*) ;; *) echo "$p still installed: $st" >&2; exit 1 ;; esac
          done
          for d in /etc/phantom-mirage /etc/default/phantom-mirage /etc/init.d/phantom-mirage /var/lib/phantom-mirage /var/log/phantom-mirage /etc/systemd/system/multi-user.target.wants/phantom-mirage.service /etc/systemd/system/multi-user.target.wants/phantom-mirage-console.service /etc/systemd/system/multi-user.target.wants/phantom-mirage-firewall.service /var/backups/phantom-mirage.keep; do
            if [ -e "$d" ] || [ -L "$d" ]; then echo "left behind: $d" >&2; exit 1; fi
          done
          if systemctl cat phantom-mirage.service >/dev/null 2>&1; then echo 'unit still present' >&2; exit 1; fi
          if systemctl cat phantom-mirage-console.service >/dev/null 2>&1; then echo 'console unit still present' >&2; exit 1; fi
          if sudo nft list table inet phantom_mirage >/dev/null 2>&1; then echo 'nft table left' >&2; exit 1; fi
          if getent passwd phantom-mirage-console; then echo 'console user left' >&2; exit 1; fi
          ! curl -sk --max-time 3 https://127.0.0.1:8443/api/health

      - name: Journal
        if: always()
        run: |
          sudo journalctl -u phantom-mirage -u farpd -u phantom-mirage-console -u phantom-mirage-firewall --no-pager | tail -n 100
