name: check-image-pubkey

# Temporary, manual-only check: does the already-committed
# release/SHA256SUMS.pub verify a published GHCR image?
# No signing secrets; does not publish or change any package.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danieldejager/phantom-mirage
  COSIGN_VERSION: v2.6.5
  # 1.7.0-7, a kept image
  DIGEST: sha256:3ac826ada8f7e39c5d0ed92a2c9f3aedecaa6cb266ac20d5dbea352bed3acbad

jobs:
  check:
    name: Check release public key against a published image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify 1.7.0-7 with release/SHA256SUMS.pub
        run: |
          set -euo pipefail
          if ! [ -s release/SHA256SUMS.pub ]; then
            echo "::error::release/SHA256SUMS.pub is missing"
            exit 1
          fi
          if cosign verify --key release/SHA256SUMS.pub --insecure-ignore-tlog=true \
              "$IMAGE@$DIGEST" > verify.json 2> verify.err; then
            echo "release/SHA256SUMS.pub verified $IMAGE@$DIGEST"
          else
            echo "release/SHA256SUMS.pub did not verify $IMAGE@$DIGEST"
            cat verify.err >&2 || true
            exit 2
          fi
