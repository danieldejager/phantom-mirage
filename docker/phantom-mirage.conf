# Example phantom-mirage configuration for the container image.
# Replace the addresses with free addresses on your decoy VLAN(s).
# Personalities must match a "Fingerprint" line in nmap-os-db.

create default
set default default tcp action block
set default default udp action block
set default default icmp action block

# A Linux server with SSH and a web server port
create linux-srv
set linux-srv personality "Linux 2.6.32"
set linux-srv uptime 1728650
set linux-srv default tcp action reset
set linux-srv default udp action reset
add linux-srv tcp port 22 open
add linux-srv tcp port 80 open
set linux-srv uid 65534 gid 65534

# A Windows workstation
create win-ws
set win-ws personality "Microsoft Windows XP Professional SP1"
set win-ws default tcp action reset
add win-ws tcp port 135 open
add win-ws tcp port 139 open
add win-ws tcp port 445 open

# Placeholder addresses (RFC 5737 documentation range)
bind 192.0.2.10 linux-srv
bind 192.0.2.11 win-ws
