name: publish

# Signed, private container images on GHCR (#20):
#   ghcr.io/danieldejager/phantom-mirage
# Pushes ONLY on v* tags and on a manual dispatch from master with
# push=true; never from pull requests.
#
# * Auth: the workflow's own GITHUB_TOKEN (packages: write). No PAT.
# * Tags: sha-<short> always, edge on master, semver on v* tags.
# * SBOM + max provenance: buildx attestations, stored in the registry
#   next to the image (private). Nothing goes to Sigstore/Rekor.
# * Signature: cosign with a private key from repository secrets
#   (COSIGN_PRIVATE_KEY, COSIGN_PASSWORD), by digest, with
#   --tlog-upload=false so nothing is recorded in the public
#   transparency log. A missing key fails the job.
# * The package must be private: checked through the API after every
#   push (also the very first one, which creates the package).

# CI minutes: only v* tags and manual dispatch (push=true to publish
# edge/sha from master); the build is checked by the nightly Docker job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: Push and sign the image (from master)
        type: boolean
        default: false
      cleanup:
        description: GHCR retention after a successful publish (dry-run only logs)
        type: choice
        options: [dry-run, delete, skip]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # never cancel a publish half-way (pushed but unsigned); only build-only runs
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.push }}

env:
  IMAGE: ghcr.io/danieldejager/phantom-mirage
  PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push && github.ref == 'refs/heads/master') }}
  COSIGN_VERSION: v2.6.5

jobs:
  image:
    name: Build, push, sign (amd64 + arm64)
    # Cleanup-only dispatch (push left off) skips the build and still
    # runs the retention job as a dry run. A publish still requires a
    # v* tag or a dispatch from master with push ticked.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing key present (push only)
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error title=No signing key::Repository secret COSIGN_PRIVATE_KEY is not set. Create it (and COSIGN_PASSWORD) as described in docs/docker.md; refusing to publish an unsigned image."
            exit 1
          fi
          if [ -z "${COSIGN_PASSWORD+x}" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "::error title=No key password::Repository secret COSIGN_PASSWORD is not set (see docs/docker.md)."
            exit 1
          fi
          echo "signing key secrets are present (contents not shown)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with GITHUB_TOKEN
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          # explicit: metadata-action would otherwise copy the GitHub repo
          # description into the image
          labels: |
            org.opencontainers.image.title=phantom-mirage
            org.opencontainers.image.description=Phantom Mirage I, based on Honeyd
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=phantom-mirage
            org.opencontainers.image.description=Phantom Mirage I, based on Honeyd
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build (and push on master / v*)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # in-toto SBOM and SLSA provenance as registry attestations
          # (private, next to the image; not sent to any transparency log)
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package is private
        # Right after the push, so the very first push (which creates the
        # package) is checked too. Fails loudly if it is public or if the
        # visibility can't be read.
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if vis=$(gh api "users/$OWNER/packages/container/phantom-mirage" -q .visibility 2>err.txt); then break; fi
            vis=; sleep 10
          done
          if [ -z "$vis" ]; then
            echo "::error title=Visibility unknown::Could not read the visibility of ghcr.io/$OWNER/phantom-mirage: $(cat err.txt). Check it at https://github.com/users/$OWNER/packages/container/package/phantom-mirage/settings and make it private."
            exit 1
          fi
          echo "package visibility: $vis"
          if [ "$vis" != private ]; then
            echo "::error title=PACKAGE IS PUBLIC::ghcr.io/$OWNER/phantom-mirage is '$vis'. Make it private NOW: https://github.com/users/$OWNER/packages/container/package/phantom-mirage/settings"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign by digest (private key, no transparency log)
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::no image digest from the build"; exit 1; }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --recursive "$IMAGE@$DIGEST" 2>&1 | tee sign.log
          if grep -Eiq 'tlog entry created|rekor' sign.log; then
            echo "::error::cosign talked to a transparency log"; exit 1
          fi

      - name: Verify the signature; no public log entry
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # the public half only, written to a file, never printed
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub 2>/dev/null
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            "$IMAGE@$DIGEST" > verify.json
          echo "signature verified for $IMAGE@$DIGEST"
          # no Rekor bundle attached to the signature: it was never logged
          cosign download signature "$IMAGE@$DIGEST" > sig.json
          # one JSON object per line; cosign always emits a "Bundle" field,
          # null when nothing was logged. Fail only on a real bundle.
          jq -c '{Bundle: .Bundle, RFC3161Timestamp: .RFC3161Timestamp}' sig.json
          n=$(jq -s 'length' sig.json)
          logged=$(jq -s '[.[] | select(.Bundle != null and .Bundle != {})] | length' sig.json)
          echo "signatures: $n, with a transparency-log bundle: $logged"
          [ "$n" -gt 0 ] || { echo "::error::no signature found"; exit 1; }
          if [ "$logged" != 0 ]; then
            echo "::error::the signature carries a transparency-log bundle"; exit 1
          fi
          echo "no transparency-log bundle on the signature"

      - name: Attestations stay in the registry
        # buildx stores the SBOM and provenance as attestation manifests in
        # the image index (unsigned, private); check they are there.
        # also when signing/verification failed: the attestations are
        # pushed with the image and should be checked regardless
        if: env.PUSH == 'true' && !cancelled() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # manifests only: never pipe the full SPDX/provenance documents
          # into head (SIGPIPE made buildx exit 255 under pipefail)
          python3 ci/check_attestations.py "$IMAGE@$DIGEST"

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### phantom-mirage image"
            echo "push: $PUSH"
            echo "digest: \`${DIGEST:-none}\`"
            echo '```'; echo "$TAGS"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GHCR retention (#20): keep edge, every release tag (v*, X.Y.Z, X.Y, X)
  # and the 3 newest other tagged images (sha-<hex> only). Cosign
  # sha256-<digest>.sig / .att / .sbom tags and attestation manifests of a
  # kept image (the index and every descriptor in it) are excluded by exact
  # tag name, tied to a digest that is actually being kept. They are removed
  # only as orphans of a deleted image. keep-n-tagged is restricted to
  # sha-<hex> tags so referrer tags cannot fill those three slots.
  # Before the cleanup action (dry-run or delete) the job derives the
  # public key from COSIGN_PRIVATE_KEY and verifies every kept image
  # digest from the same run that produced exclude-tags. A failed
  # signature stops the job before anything is deleted.
  # Runs after a successful publish, or on a cleanup-only dispatch (push
  # left off; always a dry run unless cleanup=delete on master). Dry run
  # unless dispatched with cleanup=delete or, for v* tag pushes, the repo
  # variable GHCR_CLEANUP is "delete".
  cleanup:
    name: GHCR retention
    needs: image
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.image.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.cleanup != 'skip' &&
          (needs.image.result == 'success' || needs.image.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # write includes read, and is required by the cleanup action when
      # cleanup=delete runs from master. The verify step only needs read.
      packages: write
    steps:
      - name: Mode
        id: mode
        env:
          INPUT: ${{ inputs.cleanup }}
          VAR: ${{ vars.GHCR_CLEANUP }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            m=$INPUT
            # delete only from master; a branch dispatch stays a dry run
            if [ "$m" = delete ] && [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::warning::cleanup=delete is ignored off master; staying in dry-run"
              m=dry-run
            fi
          else
            m=${VAR:-dry-run}
          fi
          [ "$m" = delete ] && dry=false || dry=true
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "GHCR retention: dry-run=$dry" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exact referrer tags of kept images
        id: referrers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 ci/ghcr_kept_referrers.py \
            --owner danieldejager \
            --package phantom-mirage \
            --out-excludes referrer-excludes.txt \
            --out-deletes referrer-deletes.txt \
            --out-kept-digests kept-digests.txt
          extra=$(cat referrer-excludes.txt)
          going=$(cat referrer-deletes.txt)
          # base globs: edge, v*, and semver 1 / 1.7 / 1.7.0 (majors up to 99).
          # Referrer tags are appended as exact names (sha256-<digest>.sig
          # and .att / .sbom), never as a prefix glob, so a renamed tag
          # cannot slip through and signatures of deleted images are not
          # kept. wildcard-match syntax: * and ?; a dot is literal.
          base='edge,v*,?,??,?.*,??.*'
          sha='sha-???????,sha-????????,sha-?????????,sha-??????????,sha-???????????,sha-????????????'
          if [ -n "$extra" ]; then excl="${base},${extra}"; else excl="$base"; fi
          if [ -n "$going" ]; then del="${sha},${going}"; else del="$sha"; fi
          {
            echo "exclude<<EOF"
            echo "$excl"
            echo "EOF"
            echo "delete<<EOF"
            echo "$del"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify signatures of every kept image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error title=No signing key::Repository secret COSIGN_PRIVATE_KEY is not set; cannot verify kept images."
            exit 1
          fi
          if [ -z "${COSIGN_PASSWORD+x}" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "::error title=No key password::Repository secret COSIGN_PASSWORD is not set; cannot derive the public key."
            exit 1
          fi
          # public half only, written to a file, never printed
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub 2>/dev/null
          unset COSIGN_PRIVATE_KEY COSIGN_PASSWORD
          trap 'rm -f cosign.pub' EXIT
          if ! grep -q -- "-----BEGIN " cosign.pub; then
            echo "::error::failed to derive the public key from COSIGN_PRIVATE_KEY"
            exit 1
          fi
          if [ ! -s kept-digests.txt ]; then
            echo "::error::no kept image digests from the referrer computation"
            exit 1
          fi
          failed=0
          n=0
          while IFS= read -r digest || [ -n "$digest" ]; do
            [ -n "$digest" ] || continue
            n=$((n + 1))
            err=verify-$n.err
            out=verify-$n.json
            # signatures were never logged to Rekor
            if cosign verify --key cosign.pub --insecure-ignore-tlog=true \
                "$IMAGE@$digest" > "$out" 2> "$err"; then
              echo "signature verified for $IMAGE@$digest"
            else
              echo "::error::signature verification failed for $IMAGE@$digest"
              cat "$err" >&2 || true
              failed=1
            fi
          done < kept-digests.txt
          if [ "$n" -eq 0 ]; then
            echo "::error::kept digest list was empty"
            exit 1
          fi
          echo "verified $n kept image(s)"
          echo "kept images verified: $n" >> "$GITHUB_STEP_SUMMARY"
          # This repo signs with `cosign sign`, not `cosign attest`.
          # The in-toto SBOM and provenance next to the image are from
          # buildx, not cosign, so verify-attestation applies only if a
          # sha256-<digest>.att tag is actually present.
          att_subjects=$(tr ',' '\n' < referrer-excludes.txt | sed -n 's/^sha256-\([0-9a-f]\{64\}\)\.att$/sha256:\1/p' || true)
          if [ -z "$att_subjects" ]; then
            echo "no cosign attestations among kept referrer tags (buildx in-toto SBOM and provenance manifests are not cosign); skipping cosign verify-attestation"
          else
            a=0
            for digest in $att_subjects; do
              a=$((a + 1))
              err=att-$a.err
              out=att-$a.json
              if cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true \
                  "$IMAGE@$digest" > "$out" 2> "$err"; then
                echo "attestation verified for $IMAGE@$digest"
              else
                echo "::error::attestation verification failed for $IMAGE@$digest"
                cat "$err" >&2 || true
                failed=1
              fi
            done
          fi
          [ "$failed" = 0 ] || exit 1
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: danieldejager
          package: phantom-mirage
          exclude-tags: ${{ steps.referrers.outputs.exclude }}
          # Restrict keep-n-tagged to sha-<hex> image tags (the
          # metadata-action short SHA is 7 hex digits; 8-12 are listed
          # in case that format grows). This must not use sha-*, which
          # would also match sha256-<digest>.sig. Exact referrer tags of
          # images that are being deleted are appended so they go in the
          # same run as their parent, not only as later orphans.
          delete-tags: ${{ steps.referrers.outputs.delete }}
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
          dry-run: ${{ steps.mode.outputs.dry }}
